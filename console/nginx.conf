events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # avoid request truncation on big payloads
  client_max_body_size 20m;

  sendfile on;
  keepalive_timeout 65;

  # docker DNS inside the network
  resolver 127.0.0.11 ipv6=off valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api_gateway {
    server api-gateway:8000;
  }

  server {
    # keep this port consistent with your compose mapping
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ---- Health endpoint aliases (UI expects /api[/v1]/health) ----
    location = /api/v1/health { proxy_pass http://api_gateway/health; }
    location = /api/health    { proxy_pass http://api_gateway/health; }
    # keep a plain /health passthrough too
    location = /health        { proxy_pass http://api_gateway/health; }

    # ---- Main API proxy (no prefix stripping; gateway expects /api/...) ----
    location /api/ {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      # generous timeouts for compiles
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;

      # defensive CORS (helps if any UI code calls :8000 directly)
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      if ($request_method = OPTIONS) { return 204; }
    }
  }
}
