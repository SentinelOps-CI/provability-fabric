# Optional / out-of-workspace crates (build separately when deps or API are available):
# - runtime/egress-firewall: needs native Hyperscan (libhs). Build: cargo build -p egress-firewall
# - core/sdk/rust: needs protoc. Build: cargo build -p provability-fabric-core-sdk-rust
# - runtime/sidecar-watcher/fuzz: fuzz targets; build with cargo build -p sidecar-watcher-fuzz (e.g. on Linux)
# - runtime/telemetry-service, runtime/mpc-fintech, runtime/jwks-manager: not in workspace; add to members above to build with cargo build --workspace
#
# Known dependency notes:
# - redis: attestor/kms-proxy use redis-rs with tokio-comp (see their Cargo.toml).
[workspace]
members = [
    "bench",
    "core/sdk/rust",
    "runtime/attestor",
    "runtime/kms-proxy",
    "runtime/tool-broker",
    "runtime/sidecar-watcher",
    "runtime/labeler",
    "runtime/wasm-sandbox",
    "adapters/http-get",
    "adapters/file-read",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"


