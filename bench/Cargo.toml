# SPDX-License-Identifier: Apache-2.0
# Benchmark crate for Provability Fabric (Criterion). Used by nightly CI only.
[package]
name = "provability-fabric-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
sidecar-watcher = { path = "../runtime/sidecar-watcher" }
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"

[[bench]]
name = "performance_benchmarks"
path = "performance_benchmarks.rs"
harness = false
