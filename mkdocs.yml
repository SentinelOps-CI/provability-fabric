# SPDX-License-Identifier: Apache-2.0

site_name: Provability-Fabric
site_description: Open-source framework for AI agent behavioral guarantees
site_author: Provability-Fabric Contributors
site_url: https://provability-fabric.org/

repo_name: provability-fabric/provability-fabric
repo_url: https://github.com/provability-fabric/provability-fabric
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: build

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to system preference

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - New Features:
      - Real-Time Communication: features/real-time-communication.md
      - Advanced Search: features/advanced-search.md
      - Authentication & User Management: features/authentication.md
  - Deployment:
      - Production Deployment: deployment/production-deployment.md
      - Original Deployment Guide: deployment-guide.md
  - Developer Guide: developer-guide.md
  - Examples: examples.md
  - Adapters:
      - Overview: adapters.md
      - α-β-CROWN Adapter: alpha-beta-crown-adapter.md
  - Security: security/overview.md
  - API Reference: api-reference.md
  - Testing: testing-guide.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/provability-fabric/provability-fabric
    - icon: fontawesome/brands/discord
      link: https://discord.gg/provability-fabric
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/provabilityfab

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


