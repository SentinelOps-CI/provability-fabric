name: Privacy Testing

on:
  push:
    branches: [main]
    paths:
      - "runtime/privacy/**"
      - "runtime/sidecar-watcher/**"
      - "tools/privacy/**"
      - ".github/workflows/privacy-test.yaml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/privacy/**"
      - "runtime/sidecar-watcher/**"
      - "tools/privacy/**"
      - ".github/workflows/privacy-test.yaml"
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

env:
  GO_VERSION: "1.25.0"
  RUST_VERSION: "stable"

jobs:
  test-epsilon-guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-case: [budget-exhaustion, config-validation, metrics-export]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies
        run: |
          cd tools/privacy
          go mod download

          cd ../../runtime/sidecar-watcher
          cargo fetch

      - name: Test epsilon guard budget exhaustion
        if: matrix.test-case == 'budget-exhaustion'
        run: |
          cd runtime/sidecar-watcher
          cargo test test_epsilon_guard_budget_exhaustion -- --nocapture

      - name: Test epsilon guard configuration validation
        if: matrix.test-case == 'config-validation'
        run: |
          cd runtime/sidecar-watcher
          cargo test test_epsilon_guard_config_validation -- --nocapture

      - name: Test privacy metrics export
        if: matrix.test-case == 'metrics-export'
        run: |
          cd runtime/sidecar-watcher
          cargo test test_privacy_metrics_export -- --nocapture

  test-dsar-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate test key pair
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          cat > gen-key.batch <<'EOF'
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: Test User
          Name-Email: test@example.com
          Expire-Date: 0
          %no-protection
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --generate-key gen-key.batch
          gpg --export --armor test@example.com > test-public-key.asc

      - name: Test and build DSAR export tool
        run: |
          cd tools/privacy
          go test ./...
          go build -o dsar-export .

      - name: Verify actual encrypted synthetic DSAR export
        shell: bash
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -euo pipefail
          cd tools/privacy
          ./dsar-export \
            --tenant test-tenant-1 \
            --after 2024-01-01 \
            --output test-export.zip \
            --public-key ../../test-public-key.asc

          test -s test-export.zip
          grep -q -- '^-----BEGIN PGP MESSAGE-----' test-export.zip
          gpg --batch --yes --output "$RUNNER_TEMP/dsar-decrypted.zip" \
            --decrypt test-export.zip
          python3 ../../tests/privacy/verify_dsar_archive.py \
            "$RUNNER_TEMP/dsar-decrypted.zip" \
            --tenant test-tenant-1 --after 2024-01-01
          rm -f "$RUNNER_TEMP/dsar-decrypted.zip"

      - name: Exercise DSAR archive negative controls
        run: python3 -m unittest discover -s tests/privacy -p test_verify_dsar_archive.py -v

  test-privacy-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build sidecar watcher
        run: |
          cargo build --release -p sidecar-watcher

      - name: Start mock ledger service
        run: |
          # Start a simple HTTP server to mock the ledger
          python3 -m http.server 3000 &
          echo $! > ledger.pid

      - name: Run privacy load test
        env:
          KUBECONFIG: /dev/null
        run: |
          SIDECAR_BIN=target/release/sidecar-watcher
          if [ ! -x "$SIDECAR_BIN" ]; then
            echo "ERROR: sidecar binary not found at $SIDECAR_BIN"
            exit 1
          fi

          LEDGER_URL=http://127.0.0.1:3000 "$SIDECAR_BIN" &
          echo $! > watcher.pid

          for i in $(seq 1 90); do
            if curl -sf http://localhost:9090/metrics | grep -q .; then
              break
            fi
            sleep 1
          done

          if ! curl -sf http://localhost:9090/metrics | grep -q .; then
            echo "ERROR: sidecar metrics endpoint unavailable"
            # ci-honesty: justified wave7-remediation
            pgrep -af sidecar-watcher || true
            exit 1
          fi

          cargo test -p sidecar-watcher test_privacy_metrics_export -- --nocapture
          cargo test -p sidecar-watcher test_epsilon_guard_budget_exhaustion -- --nocapture

      - name: Cleanup
        if: always()
        run: |
          # Stop processes
          if [ -f watcher.pid ]; then
            # ci-honesty: justified wave7-remediation
            kill $(cat watcher.pid) || true
          fi
          if [ -f ledger.pid ]; then
            # ci-honesty: justified wave7-remediation
            kill $(cat ledger.pid) || true
          fi

  test-privacy-integration:
    # Aggregates completed isolated checks; no live ledger/DSAR integration is claimed.
    name: Privacy smoke aggregation (no end-to-end claim)
    runs-on: ubuntu-latest
    needs: [test-epsilon-guard, test-dsar-export, test-privacy-load]

    steps:
      - name: Report exercised test scopes
        run: |
          echo "Upstream epsilon-guard tests completed."
          echo "A synthetic DSAR export was encrypted, decrypted and validated."
          echo "The sidecar metrics smoke completed."
          echo "Live ledger export, cross-component privacy, and production DSAR enforcement were not tested."
