name: Publish Updates

# Writes docs/updates.md from live metrics publishers and pushes commits.
# Historically failed as disabled_inactivity; not an honest gated CI path
# without stable external metric sources. Kept as workflow_dispatch-only so
# inventory is not gated on an unachievable path (same pattern as #194/#196).
on:
  workflow_dispatch:

jobs:
  publish-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Publish updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/metrics/publish_updates.py

      - name: Check for critical failures
        id: check-failures
        run: |
          if python tools/metrics/publish_updates.py; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.check-failures.outputs.status == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/updates.md
          git commit -m "Update metrics [skip ci]" || exit 0
          git push

      - name: Fail on critical violations
        if: steps.check-failures.outputs.status == 'failure'
        run: |
          echo "❌ Critical metrics failing - check docs/updates.md for details"
          exit 1
