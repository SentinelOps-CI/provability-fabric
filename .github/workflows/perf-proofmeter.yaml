name: ProofMeter Performance

# CI smoke: local mock /proof + tiny proofmeter_bench with success/latency asserts.
# Full high-RPS job remains dispatch-only (live ProofMeter).
on:
  push:
    branches: [main, develop]
    paths:
      - "tests/perf/**"
      - ".github/workflows/perf-proofmeter.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/perf/**"
      - ".github/workflows/perf-proofmeter.yaml"
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke or full"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, full]

jobs:
  perf-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'smoke'
    name: Performance Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build benchmark tool
        run: |
          cd tests/perf
          go build -o proofmeter_bench proofmeter_bench.go

      - name: Start mock ProofMeter
        run: |
          python3 tests/perf/mock_load_server.py &
          echo $! > /tmp/mock-pm.pid
          sleep 1
          curl -sf -X POST http://127.0.0.1:8080/proof -H 'Content-Type: application/json' -d '{}'

      - name: Run smoke benchmark
        run: |
          cd tests/perf
          ./proofmeter_bench \
            --rps 10 \
            --duration 5s \
            --concurrency 2 \
            --endpoint http://127.0.0.1:8080/proof \
            --output smoke_results.json \
            --seed 12345 \
            --no-gates
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("smoke_results.json").read_text(encoding="utf-8"))
          s = data["summary"]
          assert s["total_requests"] >= 20, s
          assert s["success_rate"] >= 0.99, s
          # Go encodes durations as nanoseconds in JSON
          p95_ns = s["p95_latency"]
          p95_ms = p95_ns / 1e6
          assert p95_ms < 500, f"p95 {p95_ms}ms too high: {s}"
          assert s["failed_requests"] == 0, s
          print(f"proofmeter smoke asserts ok: n={s['total_requests']} p95_ms={p95_ms:.2f}")
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: tests/perf/smoke_results.json
          retention-days: 14

      - name: Stop mock
        if: always()
        run: |
          # ci-honesty: justified wave8-local-proofs
          if [ -f /tmp/mock-pm.pid ]; then kill "$(cat /tmp/mock-pm.pid)" || true; fi

  perf-full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    name: Performance Full Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build and note
        run: |
          cd tests/perf
          go build -o proofmeter_bench proofmeter_bench.go
          echo "Full mode requires a live ProofMeter service; refusing stub sleep."
          echo "Start a real service and re-run with --endpoint set, or use smoke mode."
          exit 1
