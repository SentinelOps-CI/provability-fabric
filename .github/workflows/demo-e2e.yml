#
# This workflow exercises full-profile startup, explicit refusal of unproved
# generated Lean obligations, and synthetic demo HTTP boundaries. It does NOT
# establish verified proof issuance, policy authorization or replay correctness.
name: Demo Full-Profile Contract Smoke

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'demos/verifiable-mcp-fraud/**'
      - 'runtime/tool-broker/Dockerfile'
      - 'tests/integration/verify_full_profile_demo.py'
      - '.github/workflows/demo-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - 'demos/verifiable-mcp-fraud/**'
      - 'runtime/tool-broker/Dockerfile'
      - 'tests/integration/verify_full_profile_demo.py'
      - '.github/workflows/demo-e2e.yml'

permissions:
  contents: read

jobs:
  full-profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - name: Checkout exact revision
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Provision disposable receipt signer for full-profile smoke
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        key_dir="$(mktemp -d "${RUNNER_TEMP}/pf-demo-receipt-XXXXXXXX")"
        chmod 700 "$key_dir"
        key_file="$key_dir/retrieval-receipt.pem"
        openssl genpkey -algorithm Ed25519 -out "$key_file"
        chmod 600 "$key_file"
        test -s "$key_file"
        printf 'PF_RECEIPT_SIGNING_KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"
        printf 'PF_DEMO_RECEIPT_KEY_DIR=%s\n' "$key_dir" >> "$GITHUB_ENV"

    - name: Start actual full-profile services
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
        # Startup is separate from proof-backed policy setup. The latter
        # correctly fails with HTTP 422 for generated admitted obligations.
        make demo-up WAIT=180

    - name: Check live proof refusal and synthetic demo HTTP contracts
      shell: bash
      run: |
        set -euo pipefail
        python3 tests/integration/verify_full_profile_demo.py \
          --output artifacts/full-profile-contract.json

    - name: Validate generation of 10,000 synthetic transactions
      shell: bash
      run: |
        set -euo pipefail
        # This produces in-memory fixtures. No requests are sent to the ledger.
        docker compose --profile full run --rm --no-deps verifiable-mcp-fraud \
          node --input-type=module -e '
            import { TransactionSimulator } from "./dist/src/transaction-simulator.js";
            const transactions = new TransactionSimulator().generateBatch(10000, "acme-corp");
            if (transactions.length !== 10000 ||
                transactions.some((tx) => tx.tenant_id !== "acme-corp")) {
              throw new Error("Synthetic generator count or tenant mismatch");
            }
            console.log("Generated 10000 in-memory fixtures; ledger ingestion not tested.");
          '

    - name: Upload scoped synthetic contract evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: full-profile-contract-evidence
        path: artifacts/full-profile-contract.json
        if-no-files-found: warn

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        set -uo pipefail
        echo "Cleaning up demo environment..."
        status=0
        make demo-down || status=$?
        # The test key is unique to this CI run. Never publish or reuse it.
        if [[ -n "${PF_DEMO_RECEIPT_KEY_DIR:-}" ]]; then
          if [[ "$PF_DEMO_RECEIPT_KEY_DIR" == "$RUNNER_TEMP"/pf-demo-receipt-* ]]; then
            rm -rf -- "$PF_DEMO_RECEIPT_KEY_DIR" || status=1
          else
            echo "Unexpected receipt key directory; refusing unbounded cleanup" >&2
            status=1
          fi
        fi
        docker system prune -f || status=1
        exit "$status"