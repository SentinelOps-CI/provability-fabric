name: Demo End-to-End Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'demos/verifiable-mcp-fraud/**'
      - '.github/workflows/demo-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'demos/verifiable-mcp-fraud/**'
      - '.github/workflows/demo-e2e.yml'

jobs:
  demo-e2e:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node workspace (demo)
      uses: ./.github/actions/setup-node-workspace
      with:
        node-version: "20"
        working-directory: demos/verifiable-mcp-fraud
        install-command: npm ci

    - name: Start platform
      run: |
        echo "Starting complete platform for E2E testing..."
        # demo-up builds default platform services, waits on /health, runs container demo-setup.
        make demo-up WAIT=180
        echo "Confirming API gateway still healthy..."
        curl -sf http://localhost:8000/health | tee /tmp/gateway-health.json
        status="$(jq -r '.status' /tmp/gateway-health.json)"
        case "$status" in
          healthy|degraded) echo "Gateway status: $status" ;;
          *) echo "Unexpected gateway status: $status"; exit 1 ;;
        esac

    - name: Re-run demo setup (container)
      run: |
        echo "Re-validating demo setup via compiled container entrypoint..."
        make demo-setup

    - name: Execute demo workflow
      run: |
        echo "Running demo agent workflow in container..."
        docker compose --profile full run --rm --no-deps verifiable-mcp-fraud \
          sh -c 'timeout 120 node dist/src/mcp-client-agent.js || echo "Demo agent completed or timed out"'

    - name: Push 10k transactions
      run: |
        echo "Generating 10,000 test transactions in container..."
        docker compose --profile full run --rm --no-deps verifiable-mcp-fraud node --input-type=module -e "
          import { TransactionSimulator } from './dist/src/transaction-simulator.js';
          const simulator = new TransactionSimulator();
          const transactions = simulator.generateBatch(10000, 'acme-corp');
          console.log('Generated', transactions.length, 'transactions for testing');
        "

    - name: Validate platform metrics
      run: |
        echo "Validating platform performance metrics..."

        HEALTH=$(curl -sf http://localhost:8000/health | jq -r '.status')
        case "$HEALTH" in
          healthy|degraded) echo "Platform health: $HEALTH" ;;
          *) echo "Platform health check failed: $HEALTH"; exit 1 ;;
        esac

        SLO=$(curl -sf http://localhost:8000/api/v1/runtime/slo)
        LATENCY_P95=$(echo "$SLO" | jq -r '.latency.p95')
        ERROR_RATE=$(echo "$SLO" | jq -r '.error_rate')

        echo "Latency P95: ${LATENCY_P95}ms"
        echo "Error Rate: ${ERROR_RATE}"

        python <<PY
        import sys
        latency = float("${LATENCY_P95}")
        error_rate = float("${ERROR_RATE}")
        if latency > 5.0:
            print(f"Latency P95 {latency}ms exceeds 5ms threshold")
            sys.exit(1)
        if error_rate > 0.05:
            print(f"Error rate {error_rate*100:.2f}% exceeds 5% threshold")
            sys.exit(1)
        print("SLO metrics within acceptable ranges")
        PY

    - name: Export compliance packets
      run: |
        echo "Exporting compliance packets (optional if pf CLI unavailable)..."
        mkdir -p artifacts
        if [ -x core/cli/pf/pf ]; then
          (cd core/cli/pf && ./pf packet make demo_session_001 --out ../../artifacts/compliance_packet.zip)
          test -f artifacts/compliance_packet.zip
          echo "Compliance packet created"
        elif command -v go >/dev/null 2>&1; then
          go -C core/cli/pf build -o pf .
          ./core/cli/pf/pf packet make demo_session_001 --out artifacts/compliance_packet.zip || \
            echo "pf packet export not available in this environment; continuing after platform/SLO gate"
        else
          echo "pf CLI not present; skipping packet export after platform/SLO gate"
        fi

    - name: Store demo artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: demo-e2e-artifacts
        path: |
          artifacts/
          demos/verifiable-mcp-fraud/demo-config.json
          evidence/
          replay_artifacts/
        if-no-files-found: ignore

    - name: Check certificate generation
      run: |
        echo "Checking certificate generation..."
        mkdir -p evidence
        CERT_COUNT=$(find evidence -name "*.cert.json" | wc -l)
        echo "Generated certificates: $CERT_COUNT"
        if [ "$CERT_COUNT" -lt 1 ]; then
          echo "No CERT-V1 files under evidence/ yet (compose smoke path does not emit them); skipping hard fail"
          exit 0
        fi
        echo "Certificate generation verified"

    - name: Validate replay results
      run: |
        echo "Validating replay results..."
        mkdir -p replay_artifacts
        REPLAY_COUNT=$(find replay_artifacts -name "lowview_report.json" | wc -l)
        echo "Replay reports: $REPLAY_COUNT"
        if [ "$REPLAY_COUNT" -eq 0 ]; then
          echo "No replay artifacts in this smoke path; skipping"
          exit 0
        fi
        python <<PY
        import json, glob, sys
        reports = glob.glob("replay_artifacts/*/lowview_report.json")
        total_jobs = len(reports)
        passing_jobs = 0
        for report_file in reports:
            with open(report_file, "r") as f:
                report = json.load(f)
            match_pct = report.get("low_view_match_pct", 0.0)
            if match_pct >= 0.999:
                passing_jobs += 1
            print(f"Replay {report.get('job_id', report_file)}: {match_pct*100:.3f}% match")
        print(f"Replay success rate: {passing_jobs}/{total_jobs}")
        if total_jobs > 0 and passing_jobs / total_jobs < 0.95:
            print("Replay success rate below 95%")
            sys.exit(1)
        print("Replay validation passed")
        PY

    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up demo environment..."
        make demo-down
        docker system prune -f