name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yaml"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yaml"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init external standards
        env:
          STANDARDS_GITHUB_TOKEN: ${{ secrets.STANDARDS_GITHUB_TOKEN }}
        run: make submodules

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest kubernetes requests pyyaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Kind
        run: |
          set -euo pipefail
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Cache Kind images
        uses: actions/cache@v4
        with:
          path: |
            ~/.kind
            /tmp/kind
          key: ${{ runner.os }}-kind-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-kind-

      - name: Run integration tests
        env:
          PF_SHADOW_MODE: "1"
        run: |
          # Install flake8-breakpoint for sleep detection
          pip install flake8-breakpoint

          # F06 smoke tests only (no Kind cluster required); full K8s suite is local/WSL
          timeout 20m pytest \
            tests/integration/test_cross_region.py \
            tests/integration/test_billing.py \
            tests/integration/test_marketplace.py \
            tests/integration/test_reproducibility.py \
            tests/integration/test_ledger_mcp_tenant.py \
            -v

      - name: Replay Docker invocation contract (F10)
        run: |
          chmod +x tests/replay/test_docker_invocation.sh
          bash tests/replay/test_docker_invocation.sh

      - name: Docker Compose smoke (F21)
        run: |
          chmod +x scripts/docker-compose-smoke.sh
          bash scripts/docker-compose-smoke.sh full

      - name: Cleanup Kind cluster
        if: always()
        run: |
          # ci-honesty: justified F06 optional Kind teardown when cluster was never created
          kind delete cluster --name provability-fabric-test || true

      - name: Prune Docker images
        if: always()
        run: |
          docker system prune -f
          docker image prune -f
