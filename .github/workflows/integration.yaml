name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yaml"
      - ".github/actions/setup-python-tests/**"
      - "docker-compose.yml"
      - "scripts/db/**"
      - "scripts/docker-compose-smoke.sh"
      - "charts/**"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yaml"
      - ".github/actions/setup-python-tests/**"
      - "docker-compose.yml"
      - "scripts/db/**"
      - "scripts/docker-compose-smoke.sh"
      - "charts/**"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.filter.outputs.kind }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path filter (Kind / admission)
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            kind:
              - 'runtime/admission-controller/**'
              - 'charts/**'
              - 'tests/integration/test_happy_path.py'
              - 'tests/integration/test_violation_path.py'
              - 'scripts/test_admission_parity.sh'

  integration:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Init external standards
        env:
          STANDARDS_GITHUB_TOKEN: ${{ secrets.STANDARDS_GITHUB_TOKEN }}
        run: make submodules

      - name: Set up Python tests
        uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.11"
          packages: pytest pytest-asyncio requests pyyaml flake8-breakpoint kubernetes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Kind/Helm only when admission/helm paths change; compose-smoke is the default signal.
      - name: Install Kind
        if: needs.changes.outputs.kind == 'true'
        run: |
          set -euo pipefail
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Set up Helm
        if: needs.changes.outputs.kind == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v3.12.0

      - name: Cache Kind images
        if: needs.changes.outputs.kind == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.kind
            /tmp/kind
          key: ${{ runner.os }}-kind-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-kind-

      - name: Run integration tests (compose/F06; no Kind required)
        env:
          PF_SHADOW_MODE: "1"
        run: |
          timeout 20m pytest \
            tests/integration/test_cross_region.py \
            tests/integration/test_billing.py \
            tests/integration/test_reproducibility.py \
            tests/integration/test_ledger_mcp_tenant.py \
            -v

      - name: Replay Docker invocation contract (F10)
        run: |
          chmod +x tests/replay/test_docker_invocation.sh
          bash tests/replay/test_docker_invocation.sh

      - name: Docker Compose smoke (F21)
        run: |
          chmod +x scripts/docker-compose-smoke.sh
          bash scripts/docker-compose-smoke.sh full

      - name: Cleanup Kind cluster
        if: always() && needs.changes.outputs.kind == 'true'
        run: |
          # ci-honesty: justified F06 optional Kind teardown when cluster may not exist
          kind delete cluster --name provability-fabric-test || true

      - name: Prune Docker images
        if: always()
        run: |
          docker system prune -f
          docker image prune -f
