name: Nightly Replay

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  nightly-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install replay kit deps
        run: |
          python -m pip install --upgrade pip
          if [ -f external/TRACE-REPLAY-KIT/requirements.txt ]; then \
            pip install -r external/TRACE-REPLAY-KIT/requirements.txt; \
          fi

      - name: Run replay suite
        id: run
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p replay_artifacts
          # Example canned traces; customize as needed
          if [ -f external/TRACE-REPLAY-KIT/runner.py ]; then \
            python external/TRACE-REPLAY-KIT/runner.py tests/replay/traces/basic_policy.json || true; \
            python external/TRACE-REPLAY-KIT/runner.py tests/replay/traces/multi_tenant.json || true; \
          else \
            echo "Runner not found; skipping"; \
          fi
          echo "ok" > replay_status.txt

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-replay-artifacts
          path: |
            replay_artifacts/
            replay_status.txt

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Nightly Replay Summary';
            echo '';
            echo 'Artifacts:';
            ls -la replay_artifacts || true;
          } >> "$GITHUB_STEP_SUMMARY"

name: Nightly Replay

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Run TRACE-REPLAY-KIT replays
        shell: bash
        env:
          REPLAY_RUNS: 5
          LOWVIEW_THRESHOLD: 0.999
        run: |
          bash tests/replay/run_replays.sh | tee replay_run.log

      - name: Upload replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-replay-artifacts
          path: |
            tests/replay/out/certs/*.cert.json
            replay_run.log

      - name: Summarize results
        shell: bash
        run: |
          echo '### Nightly Replay Summary' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Low-view equality oracles executed via TRACE-REPLAY-KIT.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recent certs:' >> "$GITHUB_STEP_SUMMARY"
          ls -1 tests/replay/out/certs | tail -n 10 >> "$GITHUB_STEP_SUMMARY"
name: Nightly Replays

on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2 AM UTC
  workflow_dispatch:

jobs:
  nightly-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TRACE-REPLAY-KIT deps
        run: |
          python -m pip install --upgrade pip
          if [ -f external/TRACE-REPLAY-KIT/requirements.txt ]; then \
            pip install -r external/TRACE-REPLAY-KIT/requirements.txt; \
          fi

      - name: Run replay suites
        run: |
          bash tests/replay/run_replays.sh

      - name: Upload replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-replay-artifacts
          path: tests/replay/out
          retention-days: 7

      - name: Post summary
        if: always()
        run: |
          echo "# Nightly Replay" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: tests/replay/out" >> $GITHUB_STEP_SUMMARY
