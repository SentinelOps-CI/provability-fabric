name: Revocation List Sync

# CI dry-run: validate in-tree list + mock-registry sync (merge, package, sign).
# Live external registry sync: workflow_dispatch mode=live; fail-closed without secrets.
on:
  push:
    branches: [main, develop]
    paths:
      - "runtime/admission-controller/revocation/**"
      - "scripts/revocation/**"
      - "tests/fixtures/registry/**"
      - ".github/workflows/revocation-sync.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "runtime/admission-controller/revocation/**"
      - "scripts/revocation/**"
      - "tests/fixtures/registry/**"
      - ".github/workflows/revocation-sync.yaml"
  schedule:
    - cron: "45 8 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (validate+mock sync) or live (external fetch/merge/sign)"
        required: false
        default: "dry-run"
        type: choice
        options: [dry-run, live]

jobs:
  revocation-dry-run:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local revocation list
        run: |
          set -euo pipefail
          FILE=runtime/admission-controller/revocation/revocations.json
          test -f "$FILE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("runtime/admission-controller/revocation/revocations.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert "version" in data
          assert isinstance(data["revocations"], list)
          for i, entry in enumerate(data["revocations"]):
              for key in ("sig", "reason", "ts", "revoked_by"):
                  assert key in entry, f"entry {i} missing {key}"
          print(f"ok: {len(data['revocations'])} local revocations")
          PY

      - name: Mock registry sync + package/sign
        env:
          REVOCATION_SYNC_SIGNING_KEY: ci-local-revocation-key
        run: |
          set -euo pipefail
          python3 scripts/revocation/mock_registry_sync.py \
            --remote-fixture tests/fixtures/registry/remote_revocations.json \
            --out runtime/admission-controller/revocation/revocations.synced.json
          test -f runtime/admission-controller/revocation/revocations.synced.json
          python3 - <<'PY'
          import json
          env = json.load(open("runtime/admission-controller/revocation/revocations.synced.json", encoding="utf-8"))
          assert env["list"]["source"] == "mock-registry-sync"
          assert len(env["list"]["revocations"]) >= 3
          assert env["package"]["algorithm"] == "HMAC-SHA256"
          assert len(env["package"]["signature"]) == 64
          print("mock registry sync assertions ok")
          PY

      - name: Upload synced artifact
        uses: actions/upload-artifact@v4
        with:
          name: revocations-synced
          path: runtime/admission-controller/revocation/revocations.synced.json
          retention-days: 14

  revocation-live:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Live sync (fetch + merge + sign; fail-closed)
        env:
          REVOCATION_REGISTRY_URL: ${{ secrets.REVOCATION_REGISTRY_URL }}
          REVOCATION_REGISTRY_TOKEN: ${{ secrets.REVOCATION_REGISTRY_TOKEN }}
          REVOCATION_SYNC_SIGNING_KEY: ${{ secrets.REVOCATION_SYNC_SIGNING_KEY }}
          REVOCATION_LIVE_REPORT: runtime/admission-controller/revocation/live-sync-report.json
        run: |
          set -euo pipefail
          python3 scripts/revocation/live_registry_sync.py \
            --out runtime/admission-controller/revocation/revocations.synced.json
          test -f runtime/admission-controller/revocation/revocations.synced.json
          test -f runtime/admission-controller/revocation/live-sync-report.json
          python3 - <<'PY'
          import json
          env = json.load(open("runtime/admission-controller/revocation/revocations.synced.json", encoding="utf-8"))
          report = json.load(open("runtime/admission-controller/revocation/live-sync-report.json", encoding="utf-8"))
          assert env.get("live_registry") is True
          assert env["list"]["source"] == "live-registry-sync"
          assert report.get("live_registry") is True
          assert env["package"]["algorithm"] == "HMAC-SHA256"
          assert len(env["package"]["signature"]) == 64
          print("live registry sync assertions ok")
          PY

      - name: Open PR with synced list (protected-branch policy)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/live-revocation-sync-$(date -u +%Y%m%d%H%M%S)"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b "$BRANCH"
          # Commit only the synced artifact + report; never overwrite canonical list without review.
          git add \
            runtime/admission-controller/revocation/revocations.synced.json \
            runtime/admission-controller/revocation/live-sync-report.json
          if git diff --cached --quiet; then
            echo "No revocation artifact changes; skipping PR"
          else
            git commit -m "chore: live revocation registry sync artifact"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "chore: live revocation registry sync" \
              --body "$(cat <<'EOF'
          ## Summary
          - Live \`revocation-sync\` (\`mode=live\`) fetched external registry, merged, and HMAC-signed
          - Artifacts: \`revocations.synced.json\` + \`live-sync-report.json\` (\`live_registry: true\`)

          ## Review notes
          - Review before promoting entries into \`revocations.json\`
          - Protected branch: merge via review

          EOF
          )" --base main
          fi

      - name: Upload live synced artifact
        uses: actions/upload-artifact@v4
        with:
          name: revocations-synced-live
          path: |
            runtime/admission-controller/revocation/revocations.synced.json
            runtime/admission-controller/revocation/live-sync-report.json
          retention-days: 30
