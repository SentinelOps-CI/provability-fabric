name: Fuzz Tests

on:
  push:
    branches: [main]
    paths:
      - "runtime/sidecar-watcher/**"
  pull_request:
    branches: [main]
    paths:
      - "runtime/sidecar-watcher/**"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: |
          cargo install cargo-fuzz

      - name: Set default toolchain to nightly
        run: rustup default nightly

      - name: Run fuzz tests
        run: |
          cd runtime/sidecar-watcher/fuzz
          cargo +nightly fuzz run json_actions -- -runs=1000 -max_total_time=120

      - name: Upload fuzz artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts
          path: runtime/sidecar-watcher/fuzz/fuzz/artifacts/
