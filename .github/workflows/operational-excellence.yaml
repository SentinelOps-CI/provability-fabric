name: Operational Excellence & Market-Launch Sprint

# Wave E3.4: path-filtered push/PR + daily schedule (not every main push).
on:
  push:
    branches: [main]
    paths:
      - "tools/metering/**"
      - "releaser/**"
      - "scripts/bench.py"
      - "scripts/zero-downtime-upgrade.sh"
      - "runtime/ledger/**"
      - "runtime/sidecar-watcher/**"
      - "tests/integration/**"
      - ".github/workflows/operational-excellence.yaml"
  pull_request:
    branches: [main]
    paths:
      - "tools/metering/**"
      - "releaser/**"
      - "scripts/bench.py"
      - "scripts/zero-downtime-upgrade.sh"
      - "runtime/ledger/**"
      - "runtime/sidecar-watcher/**"
      - "tests/integration/**"
      - ".github/workflows/operational-excellence.yaml"
  schedule:
    # Daily operational monitoring
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Target region for deployment"
        required: true
        default: "us-west-2"
        type: choice
        options:
          - us-west-2
          - us-east-1
      upgrade_type:
        description: "Type of upgrade to perform"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # Cross-Region Disaster Recovery & Zero-Downtime Upgrades
  cross-region-dr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      aws_available: ${{ steps.aws.outputs.available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Guard: empty secrets make configure-aws-credentials fail hard.
      # Skip DR deploy only when secrets are absent; do not continue-on-error
      # on required in-repo jobs (usage-metering, supply-chain).
      - name: Check AWS credentials availability
        id: aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS secrets not configured; skipping cross-region DR deploy (DR not validated)"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.aws.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: DR scripts smoke (no in-repo Terraform)
        run: |
          # In-repo Terraform under ops/ was removed; DR proof lives in
          # scripts/dr/ + .github/workflows/dr-cross.yaml (moto / live dispatch).
          test -f scripts/db/blue_green_migrate.sh
          test -d scripts/dr
          echo "cross-region-dr: terraform deploy removed; use dr-cross workflow."

      - name: Verify zero-downtime upgrade script present
        if: steps.aws.outputs.available == 'true'
        run: |
          test -x scripts/zero-downtime-upgrade.sh || chmod +x scripts/zero-downtime-upgrade.sh
          # ci-honesty: justified dry-run may exit non-zero without cluster context
          ./scripts/zero-downtime-upgrade.sh v1.0.1 v1.0.0 --dry-run || true

      - name: Record DR skip (secrets absent)
        if: steps.aws.outputs.available != 'true'
        run: |
          echo "cross-region-dr: live AWS steps skipped (secrets absent)."
          echo "This job did not validate production disaster recovery."

  # Per-Tenant Usage Metering & Bill-Ready Cost Reports
  usage-metering:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Build metering tool
        run: |
          cd tools/metering
          go mod tidy
          go build -o pf-metering .

      - name: Start ledger service
        run: |
          cd runtime/ledger
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

          # Wait for ledger to be ready
          timeout 120 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done'

      - name: Generate cost reports
        run: |
          cd tools/metering
          ./pf-metering generate tenant-001 2025-01 --ledger-url http://localhost:4000 --output-dir ./reports

          # Verify reports were generated
          ls -la ./reports/

          # Check report format
          jq . ./reports/*.json > /dev/null

      - name: Upload billing reports
        uses: actions/upload-artifact@v4
        with:
          name: billing-reports-${{ github.run_id }}
          path: tools/metering/reports/

      - name: Test billing integration
        run: |
          set -euo pipefail
          period=$(date -u +%Y-%m)
          # Ledger CI overlay runs PROFILE=dev (auth-simple); seed tenant is dev-tenant.
          curl -sf "http://localhost:4000/tenant/dev-tenant/invoice/csv?period=${period}" -o /tmp/invoice.csv
          curl -sf "http://localhost:4000/tenant/dev-tenant/invoice/pdf?period=${period}" -o /tmp/invoice.pdf
          test -s /tmp/invoice.csv
          test -s /tmp/invoice.pdf
          echo "Invoice CSV/PDF endpoints responded for period ${period}"

  # End-to-End Supply Chain
  # End-to-End Supply Chain Reproducibility
  supply-chain-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build with Nix
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix-build releaser/supply-chain-reproducibility.nix --no-out-link

      - name: Generate in-toto attestations
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          cd releaser
          nix-shell supply-chain-reproducibility.nix --run "generate-attestations"

      - name: Generate SBOM
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          cd releaser
          nix-shell supply-chain-reproducibility.nix --run "generate-sbom"

      - name: Sign attestations
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          cd releaser
          nix-shell supply-chain-reproducibility.nix --run "sign-attestations"

      - name: Verify reproducibility
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          cd releaser
          nix-shell supply-chain-reproducibility.nix --run "verify-attestations"
          nix-shell supply-chain-reproducibility.nix --run "verify-sbom"
          nix-shell supply-chain-reproducibility.nix --run "verify-signed-attestations"

      - name: Upload attestations and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts-${{ github.run_id }}
          path: |
            releaser/attestations/
            releaser/sbom.*

  # Integration Testing
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      [
        cross-region-dr,
        usage-metering,
        supply-chain-reproducibility,
      ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest kubernetes requests pyyaml

      - name: Run integration tests
        run: |
          # Test cross-region functionality
          pytest tests/integration/test_cross_region.py -v

          # Test billing integration
          pytest tests/integration/test_billing.py -v


          # Test reproducibility
          pytest tests/integration/test_reproducibility.py -v

  # Performance Benchmarking
  performance-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [integration-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: pip install psutil

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar watcher
        run: cargo build --release --bin sidecar-watcher --manifest-path runtime/sidecar-watcher/Cargo.toml

      - name: Run performance benchmarks
        env:
          SIDECAR_BIN: target/release/sidecar-watcher
        run: |
          # Prebuilt binary via SIDECAR_BIN; health wait is in scripts/bench.py.
          python scripts/bench.py --count 10000 --output scripts/perf-results.json

          # Analyze results (bench.py emits *_latency_us keys)
          python -c "
          import json
          with open('scripts/perf-results.json') as f:
              data = json.load(f)
          mean_ms = data['mean_latency_us'] / 1000.0
          p95_ms = data['p95_latency_us'] / 1000.0
          count = data['action_count']
          print(f'Average latency: {mean_ms:.4f}ms')
          print(f'P95 latency: {p95_ms:.4f}ms')
          print(f'Actions measured: {count}')
          "

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_id }}
          path: scripts/perf-results.json

  # Security Scanning
  security-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [performance-benchmarks]
    env:
      SYFT_VERSION: "1.19.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # gosec v2.30.0 needs Go 1.25 or newer; avoid an implicit toolchain download.
          go-version: "1.26"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Syft
        run: |
          set -euo pipefail
          SYFT_DIR="$(mktemp -d)"
          curl -sSL -o "$SYFT_DIR/syft.tgz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$SYFT_DIR/syft.tgz" -C "$SYFT_DIR"
          SYFT_BIN="$(find "$SYFT_DIR" -type f -name syft | head -1)"
          test -n "$SYFT_BIN"
          sudo install -m 0755 "$SYFT_BIN" /usr/local/bin/syft
          syft version

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Run Syft SBOM generation
        run: |
          syft . -o json --file sbom.json
          syft . -o spdx-json --file sbom.spdx.json

      - name: Run Go security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          # Best-effort scan; gosec exits non-zero when findings exist.
          gosec -fmt json -out gosec-results.json ./... || test -f gosec-results.json

      - name: Run Rust security scanner using identified upstream snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Avoid Git smart-HTTP 403 on the RustSec advisory DB. Fetch the
          # authoritative upstream revision through GitHub REST/codeload.
          # The script fails if the database cannot be obtained or parsed;
          # real vulnerability findings are retained in the JSON artifact.
          bash scripts/ci/run_rustsec_audit.sh cargo-audit-results.json

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results-${{ github.run_id }}
          path: |
            trivy-results.sarif
            sbom.json
            sbom.spdx.json
            gosec-results.json
            cargo-audit-results.json
            rustsec-database-source.json
          if-no-files-found: warn

  # Final Validation
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-scanning]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identify the reporting boundary
        run: |
          echo "Security scan job completed; advisory reports are informational."
          echo "Conditional infrastructure steps and global CI are outside this report."
          echo "Review uploaded scan artifacts before assessing vulnerability findings."

      - name: Generate evidence-scoped summary report
        shell: bash
        run: |
          set -euo pipefail
          cat > summary.md <<'EOF'
          # Operational workflow execution report

          ## What this workflow reports

          This run executes the configured metering, supply-chain,
          integration, performance and security-scanning jobs. A successful
          job conclusion establishes completion of its own configured steps,
          subject to conditional skips and the tests actually performed.

          ## Limits of the evidence

          - Cross-region deployment and disaster-recovery steps depend on AWS
            credentials. A successful no-credentials run does not attest to a
            deployed region, a recovery exercise or zero-downtime upgrades.
          - Gosec and cargo-audit produce informational JSON findings; their
            finding exit codes are accepted when reports exist. Trivy emits a
            SARIF report. Review the security-scan-results artifact to assess
            actual advisories, reachability and remediation status.
          - Scan job success is not an absence-of-vulnerabilities finding.
            Outstanding RustSec advisories are tracked separately in #315.
          - This workflow does not certify global CI success, production
            deployment, reproducible release artifacts, bill-ready revenue,
            runtime enforcement, or independent certificate provenance.
          EOF
          printf '\n## Linked run evidence\n\n' >> summary.md
          printf -- '- Security scan artifact: `security-scan-results-%s`\n' \
            "${{ github.run_id }}" >> summary.md
          printf -- '- Workflow run: `%s`\n' "${{ github.run_id }}" >> summary.md
          test -s summary.md

      - name: Upload summary report
        uses: actions/upload-artifact@v4
        with:
          name: operational-excellence-summary
          path: summary.md
