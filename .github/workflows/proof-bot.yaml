name: APOLLO Proof Bot (read-only proposal inspection)

on:
  pull_request:
    paths:
      - '.github/workflows/proof-bot.yaml'
      - 'tools/proofbot/**'
      - 'tests/test_proofbot_readonly.py'
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# The remote proposal service is untrusted. No repository write credential
# or automatic pull-request publishing is available to this job.
permissions:
  contents: read

jobs:
  proof-bot:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proposal-inspection dependencies
        run: python -m pip install -r tools/proofbot/requirements.txt

      - name: Verify read-only inspection and failure controls
        run: python -m unittest discover -s tests -p 'test_proofbot_readonly.py' -v

      - name: Fetch unverified proposals without modifying the repository
        if: github.event_name != 'pull_request'
        env:
          APOLLO_API_URL: ${{ vars.APOLLO_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$APOLLO_API_URL" ]; then
            echo "vars.APOLLO_API_URL unset; proof-bot requires a configured API on schedule."
            exit 1
          fi
          python tools/proofbot/run.py \
            --root . \
            --api-url "$APOLLO_API_URL" \
            --report "$RUNNER_TEMP/apollo-proposal-inventory.json"

      - name: Upload unverified proposal inventory
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: apollo-proposal-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/apollo-proposal-inventory.json
          retention-days: 14
          if-no-files-found: warn
