# SPDX-License-Identifier: Apache-2.0
name: Sidecar Health Timestamp

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/sidecar-watcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/sidecar-health-timestamp.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/sidecar-watcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/sidecar-health-timestamp.yml'

permissions:
  contents: read

jobs:
  timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Verify locked graph and health endpoint tests
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/pf-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("/tmp/pf-metadata.json").read_text())
          assert all(p["name"] != "humantime" for p in metadata["packages"])
          PY
          cargo test --locked -p sidecar-watcher --bin sidecar-watcher http_health::tests::
          git diff --exit-code -- Cargo.lock
