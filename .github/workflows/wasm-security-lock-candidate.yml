# SPDX-License-Identifier: Apache-2.0
name: WASM security migration resolver

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'security/wasm-sandbox-bounded-core-execution-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Resolve the migrated sandbox dependency graph
        run: |
          set -euo pipefail
          cargo update -p wasmtime --precise 36.0.22
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- . ':!Cargo.lock'
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock
      - name: Preserve resolver-produced lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wasm-security-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Run locked sandbox tests
        run: cargo test --locked -p wasm-sandbox
