on:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build and test Rust workspace
        run: |
          # core/sdk/rust is optional; build separately when proto bindings are ready
          cargo build --workspace --exclude provability-fabric-core-sdk-rust
          # labeler stress and tool-broker bin tests are extended/nightly coverage
          cargo test --workspace \
            --exclude provability-fabric-core-sdk-rust \
            --exclude sidecar-watcher \
            --exclude labeler \
            --exclude tool-broker \
            --no-fail-fast
          # sidecar-watcher: lib unit tests + explicit integration targets (autotests = false; see tests/README.md)
          cargo test -p sidecar-watcher --lib --no-fail-fast
          cargo test -p sidecar-watcher --tests --no-fail-fast

      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude provability-fabric-core-sdk-rust -- -D warnings
