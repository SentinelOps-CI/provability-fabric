on:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      PF_SHADOW_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Sidecar unwrap regression gate (F16)
        run: python scripts/count_sidecar_unwraps.py --max 10

      - name: Ledger any regression gate (F27)
        run: python scripts/count_ledger_any.py --max 20

      - name: Build and test Rust workspace
        run: |
          cargo build --workspace --exclude provability-fabric-core-sdk-rust
          RUSTFLAGS="-D dead_code" cargo test -p sidecar-watcher --lib -- --nocapture
          PF_SHADOW_MODE=1 RUSTFLAGS="-D dead_code" cargo test -p sidecar-watcher --test integration_tests -- --nocapture
          cargo test -p sidecar-watcher --test ni_monitor_egress --test safety_case_bundle --test events_plan_dsl --test hardened_adapters -- --nocapture
          cargo test -p retrieval-gateway -- --nocapture
          cargo test --workspace \
            --exclude provability-fabric-core-sdk-rust \
            --exclude labeler \
            --exclude tool-broker \
            --no-fail-fast

      - name: Clippy (workspace)
        run: cargo clippy --workspace --exclude provability-fabric-core-sdk-rust -- -D warnings
