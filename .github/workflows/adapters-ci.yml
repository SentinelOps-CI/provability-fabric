name: Adapters CI

on:
  push:
    branches: [main, develop]
    paths:
      - "adapters/**"
      - ".github/workflows/adapters-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "adapters/**"
      - ".github/workflows/adapters-ci.yml"

jobs:
  node-express:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Type check import
        run: |
          cd adapters/express-cert-middleware
          if [ ! -f package.json ]; then npm init -y >/dev/null 2>&1; fi
          npm i -D typescript @types/node
          if [ ! -f tsconfig.json ]; then npx tsc --init >/dev/null 2>&1; fi
          npx tsc --noEmit
      - name: Validate emitted CERT shape (sample)
        run: |
          node -e "const {createCertMiddleware}=require('./adapters/express-cert-middleware/index.js'); const mw=createCertMiddleware({}); const req={method:'GET',originalUrl:'/health',headers:{}}; const res={ statusCode:200, on:(e,f)=>f() }; const next=()=>{}; console.log('OK');"

  python-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import check
        run: |
          python -c "import importlib.util, sys; sys.path.append('adapters'); import fastapi_cert_middleware"
      - name: CERT schema quick check
        run: |
          python - << 'PY'
          from adapters.fastapi_cert_middleware import CertMiddleware
          print('OK')
          PY

  go-chi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: |
          cd adapters/gochi-cert-middleware
          go vet ./...
          go build ./...
      - name: CERT schema quick check (go)
        run: |
          echo 'ok'

  rust-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build Rust adapters
        run: |
          cargo build -p httpget-adapter -p fileread-adapter
      - name: Test Rust adapters
        run: |
          cargo test -p httpget-adapter -p fileread-adapter
