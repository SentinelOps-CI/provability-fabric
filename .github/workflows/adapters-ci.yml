name: Adapters CI

on:
  push:
    branches: [main, develop]
    paths:
      - "adapters/**"
      - ".github/workflows/adapters-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "adapters/**"
      - ".github/workflows/adapters-ci.yml"

jobs:
  node-express:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and typecheck
        working-directory: adapters/express-cert-middleware
        run: |
          npm install
          npm run typecheck
      - name: Validate emitted CERT shape (sample)
        working-directory: adapters/express-cert-middleware
        run: |
          npm run build
          node -e "const {createCertMiddleware}=require('./dist/index.js'); const mw=createCertMiddleware({}); if (typeof mw !== 'function') { throw new Error('middleware factory failed'); } console.log('OK');"

  python-fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install adapter deps
        run: pip install -r adapters/fastapi_cert_middleware/requirements.txt
      - name: Import check
        run: |
          python -c "import importlib.util, sys; sys.path.append('adapters'); import fastapi_cert_middleware"
      - name: CERT schema quick check
        run: |
          python - << 'PY'
          from adapters.fastapi_cert_middleware import CertMiddleware
          print('OK')
          PY


  go-chi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: |
          cd adapters/gochi-cert-middleware
          go vet ./...
          go build ./...
      - name: CERT schema quick check (go)
        run: |
          echo 'ok'

  rust-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build Rust adapters
        run: |
          cargo build -p httpget-adapter -p fileread-adapter
      - name: Test Rust adapters
        run: |
          cargo test -p httpget-adapter -p fileread-adapter
