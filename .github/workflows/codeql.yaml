name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Tuesdays at 4 AM UTC
    - cron: "0 4 * * 2"

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "go", "rust"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.language == 'javascript'
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker system prune -af || true
          echo "Disk after cleanup:"
          df -h

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: matrix.language == 'go'
        run: |
          cd core/cli/pf
          go mod download
          cd ../../..
          cd runtime/admission-controller
          go mod download
          cd ../..
          cd tools/specgraph
          go mod download

      - name: Install dependencies
        if: matrix.language == 'rust'
        run: |
          cd runtime/sidecar-watcher
          cargo fetch
          cd ../..
          cd runtime/attestor
          cargo fetch

      - name: Install dependencies
        if: matrix.language == 'javascript'
        run: |
          set -euo pipefail
          # Only packages in .github/codeql/codeql-config.yml paths (skip console).
          for dir in marketplace/ui runtime/ledger; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing $dir"
              (cd "$dir" && npm install --no-audit --no-fund)
            fi
          done

      - name: Build code
        if: matrix.language == 'go'
        run: |
          cd core/cli/pf
          go build -v ./...
          cd ../../..
          cd runtime/admission-controller
          go build -v ./...
          cd ../..
          cd tools/specgraph
          go build -v ./...

      - name: Build code
        if: matrix.language == 'rust'
        run: |
          cd runtime/sidecar-watcher
          cargo build --release
          cd ../..
          cd runtime/attestor
          cargo build --release

      - name: Build code
        if: matrix.language == 'javascript'
        run: |
          set -euo pipefail
          for dir in marketplace/ui runtime/ledger; do
            if [ -f "$dir/package.json" ] && grep -q '"build"' "$dir/package.json"; then
              echo "Building $dir"
              (cd "$dir" && DISABLE_ESLINT_PLUGIN=true npm run build)
            fi
          done

      - name: Drop node_modules before analysis
        if: matrix.language == 'javascript'
        run: |
          set -euo pipefail
          for dir in marketplace/ui runtime/ledger; do
            rm -rf "$dir/node_modules" || true
          done
          npm cache clean --force || true
          df -h

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  security-gates:
    name: Security Gates
    runs-on: ubuntu-latest
    needs: analyze
    if: always() && needs.analyze.result == 'success'

    steps:
      - name: Verify CodeQL analysis completed
        run: |
          echo "CodeQL analysis completed for all configured languages."
          echo "No high severity alerts gate configured in this workflow."

  security-trends:
    name: Security Trends
    runs-on: ubuntu-latest
    needs: [analyze, security-gates]
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate security trends
        run: |
          echo "📈 Security Trend Analysis"
          echo "========================="

          # This would analyze trends over time
          # For now, we'll just log the current status
          echo "Current security posture: Good"
          echo "Trend: Stable"
          echo "Recommendations: Continue current practices"

      - name: Update security dashboard
        run: |
          echo "Updating security dashboard..."
          # This would update a security dashboard
          # For now, we'll just log the action
          echo "Dashboard update completed"
