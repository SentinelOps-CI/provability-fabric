# SPDX-License-Identifier: Apache-2.0
name: Sidecar COSE Sign1 profile

on:
  pull_request:
    branches: [security/kms-authority-consolidated-20261127, main]
    paths:
      - 'runtime/sidecar-watcher/**'
      - 'scripts/test_cose_reference.py'
      - 'scripts/verify_cose_sign1.py'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/sidecar-cose-sign1.yml'

permissions:
  contents: read

jobs:
  native-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently verify reference encoding and Ed25519 signature
        run: python3 scripts/test_cose_reference.py
      - name: Verify imported native CBOR-free dependency resolution
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/cose-native.lock"
          cargo metadata --locked --all-features --format-version 1 > "$RUNNER_TEMP/cose-metadata.json"
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          names = {(p["name"], p["version"]) for p in packages}
          assert not any(n == "serde_cbor" for n, _ in names)
          assert {v for n, v in names if n == "half"} == {"2.7.1"}
          assert ("ciborium", "0.2.2") in names
          assert "[[advisories.ignore]]" not in Path("deny.toml").read_text()
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cose-metadata.json").read_text())
          assert all(p["name"] != "serde_cbor" for p in data["packages"])
          PY
          sha256sum Cargo.lock
          cmp Cargo.lock "$RUNNER_TEMP/cose-native.lock"
          git diff --exit-code -- Cargo.lock
      - name: Preserve qualified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cose-locked-Cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Verify full dependency policy with final advisory ignore removed
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features
          rust-version: stable
      - name: Native signature and complete sidecar regression suite
        run: |
          set -euo pipefail
          cargo test --locked -p sidecar-watcher --lib crypto::tests::cose_reference_vector_and_negative_controls -- --exact --nocapture | tee "$RUNNER_TEMP/cose-tests.txt"
          grep -F 'running 1 test' "$RUNNER_TEMP/cose-tests.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/cose-tests.txt"
          cargo test --locked -p sidecar-watcher --lib --bins --no-fail-fast
          cargo build --locked -p sidecar-watcher
          cargo clippy --locked -p sidecar-watcher -- -D warnings
          cmp Cargo.lock "$RUNNER_TEMP/cose-native.lock"
