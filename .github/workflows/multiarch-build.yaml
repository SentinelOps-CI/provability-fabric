#
# Wave 11.1 CI cost:
# - Path-filtered to Dockerfiles + related Rust sources.
# - Push/PR: linux/amd64 only (native ubuntu-latest; no QEMU).
# - Schedule / version tags / workflow_dispatch: dual-arch via native
#   ubuntu-latest (amd64) + ubuntu-24.04-arm (arm64); no QEMU.
# - Simulated canary / perf / cost jobs removed (were greenwashing).

name: Multi-Architecture Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "runtime/sidecar-watcher/Dockerfile"
      - "runtime/sidecar-watcher/**"
      - "runtime/egress-firewall/Dockerfile"
      - "runtime/egress-firewall/**"
      - "runtime/attestor/Dockerfile"
      - "runtime/attestor/**"
      - "core/crypto/dsse-rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/multiarch-build.yaml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/sidecar-watcher/Dockerfile"
      - "runtime/sidecar-watcher/**"
      - "runtime/egress-firewall/Dockerfile"
      - "runtime/egress-firewall/**"
      - "runtime/attestor/Dockerfile"
      - "runtime/attestor/**"
      - "core/crypto/dsse-rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/multiarch-build.yaml"
  schedule:
    # Weekly dual-arch rebuild (native amd64 + arm runners).
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform(s): linux/amd64, linux/arm64, or both"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      service:
        description: "Specific service to build (or all)"
        required: false
        default: "all"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      dual_arch: ${{ steps.set.outputs.dual_arch }}
      services: ${{ steps.set.outputs.services }}
    steps:
      - name: Write matrix JSON
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PLATFORM: ${{ github.event.inputs.platform || 'linux/amd64,linux/arm64' }}
          INPUT_SERVICE: ${{ github.event.inputs.service || 'all' }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os

          event = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          platforms = os.environ["INPUT_PLATFORM"]
          service_filter = os.environ["INPUT_SERVICE"]

          want_amd64 = True
          want_arm64 = False
          dual = False

          if event == "pull_request":
              pass
          elif event == "push":
              if ref.startswith("refs/tags/v"):
                  want_arm64 = True
                  dual = True
          elif event == "schedule":
              want_arm64 = True
              dual = True
          elif event == "workflow_dispatch":
              want_amd64 = "amd64" in platforms
              want_arm64 = "arm64" in platforms
              if not want_amd64 and not want_arm64:
                  want_amd64 = True
                  want_arm64 = True
              dual = want_amd64 and want_arm64

          services = [
              {
                  "service": "sidecar-watcher",
                  "dockerfile": "runtime/sidecar-watcher/Dockerfile",
                  "context": ".",
              },
              {
                  "service": "egress-firewall",
                  "dockerfile": "runtime/egress-firewall/Dockerfile",
                  "context": "runtime/egress-firewall",
              },
              {
                  "service": "attestor",
                  "dockerfile": "runtime/attestor/Dockerfile",
                  "context": "runtime/attestor",
              },
          ]
          if service_filter and service_filter != "all":
              services = [s for s in services if s["service"] == service_filter]
              if not services:
                  raise SystemExit(f"unknown service filter: {service_filter!r}")

          arches = []
          if want_amd64:
              arches.append(
                  {"platform": "linux/amd64", "runner": "ubuntu-latest", "arch": "amd64"}
              )
          if want_arm64:
              arches.append(
                  {
                      "platform": "linux/arm64",
                      "runner": "ubuntu-24.04-arm",
                      "arch": "arm64",
                  }
              )

          matrix = {"include": [{**s, **a} for s in services for a in arches]}
          service_names = [s["service"] for s in services]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              fh.write(f"dual_arch={'true' if dual else 'false'}\n")
              fh.write(f"services={json.dumps(service_names, separators=(',', ':'))}\n")
          print(json.dumps(matrix, indent=2))
          print(f"dual_arch={dual}")
          print(f"services={service_names}")
          PY

  build:
    name: Build (${{ matrix.service }} / ${{ matrix.arch }})
    needs: resolve-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Stage workspace Cargo.lock for Docker build
        run: |
          cargo generate-lockfile
          if [ "${{ matrix.context }}" != "." ]; then
            cp Cargo.lock "${{ matrix.context }}/Cargo.lock"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          # ignore-error: GHA cache export 400s must not fail the job after a successful
          # GHCR push (build+push is the gate; cache is best-effort).
          cache-to: ${{ github.event_name == 'pull_request' && 'type=inline' || format('type=gha,mode=max,scope={0}-{1},ignore-error=true', matrix.service, matrix.arch) }}

      - name: Image size report
        if: github.event_name != 'pull_request'
        run: |
          echo "## Image Size Report for ${{ matrix.service }} (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Notes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ matrix.platform }} | Native runner \`${{ matrix.runner }}\` (no QEMU) |" >> "$GITHUB_STEP_SUMMARY"

  merge-manifests:
    name: Merge multi-arch manifests
    needs: [resolve-matrix, build]
    if: >
      needs.resolve-matrix.outputs.dual_arch == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve-matrix.outputs.services) }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (sha + latest on default branch)
        env:
          SERVICE: ${{ matrix.service }}
          SHA_SHORT: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          short="$(echo "${SHA_SHORT}" | cut -c1-7)"
          base="${{ env.REGISTRY }}/${owner}/${repo}/${SERVICE}"

          amd="${base}:sha-${short}-amd64"
          arm="${base}:sha-${short}-arm64"
          echo "Merging ${amd} + ${arm} -> ${base}:sha-${short}"
          docker buildx imagetools create -t "${base}:sha-${short}" "${amd}" "${arm}"

          if [ "${GIT_REF}" = "refs/heads/main" ] || [[ "${GIT_REF}" == refs/tags/v* ]]; then
            docker buildx imagetools create -t "${base}:latest" \
              "${base}:latest-amd64" "${base}:latest-arm64" || \
              echo "::warning::latest-* tags missing; sha manifest created only"
          fi

          if [[ "${GIT_REF}" == refs/tags/v* ]]; then
            tag="${GIT_REF_NAME}"
            docker buildx imagetools create -t "${base}:${tag}" \
              "${base}:${tag}-amd64" "${base}:${tag}-arm64" || \
              echo "::warning::semver arch tags missing for ${tag}"
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve GHCR image ref (amd64)
        id: image
        run: |
          set -euo pipefail
          # GHCR paths are lowercase; build job tags sha-<7>-amd64 via metadata flavor.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          short="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "ref=${{ env.REGISTRY }}/${owner}/${repo}/sidecar-watcher:sha-${short}-amd64" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
