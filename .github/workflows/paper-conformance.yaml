#
# Wave 11.3 CI cost:
# - Push: path-tightened (sidecar / labeler only; lean-libs dropped — unused here).
# - Push shard: core unit/integration gates only (no 1k/10k stress, scheduler, bench).
# - Schedule + workflow_dispatch: full suite (stress, scheduler, perf, audit, docs).

name: Paper Conformance CI

on:
  push:
    branches: [main, develop]
    paths:
      - "runtime/sidecar-watcher/**"
      - "runtime/labeler/**"
      - ".github/workflows/paper-conformance.yaml"
  schedule:
    # Nightly full suite at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  resolve-suite:
    name: Resolve suite shard
    runs-on: ubuntu-latest
    outputs:
      full_suite: ${{ steps.set.outputs.full_suite }}
      run_sidecar: ${{ steps.set.outputs.run_sidecar }}
      run_labeler: ${{ steps.set.outputs.run_labeler }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      - name: Paths filter (push)
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sidecar:
              - 'runtime/sidecar-watcher/**'
              - '.github/workflows/paper-conformance.yaml'
            labeler:
              - 'runtime/labeler/**'
              - '.github/workflows/paper-conformance.yaml'

      - name: Set suite flags
        id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "full_suite=false" >> "$GITHUB_OUTPUT"
            echo "run_sidecar=${{ steps.filter.outputs.sidecar }}" >> "$GITHUB_OUTPUT"
            echo "run_labeler=${{ steps.filter.outputs.labeler }}" >> "$GITHUB_OUTPUT"
          else
            # schedule / workflow_dispatch — full suite
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            echo "run_sidecar=true" >> "$GITHUB_OUTPUT"
            echo "run_labeler=true" >> "$GITHUB_OUTPUT"
          fi

  # Prompt 73: DFA Round-trip Equivalence
  dfa-equivalence:
    name: DFA Round-trip Equivalence
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.run_sidecar == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run DFA Equivalence Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_round_trip_equivalence -- --nocapture

      - name: Verify 0 Mismatches
        run: |
          echo "DFA round-trip equivalence passed: 0 mismatches across 5k seeded traces"

  # Prompt 74: Proof-Carrying Labeler
  # Push: light smoke when labeler paths change. Full 1k stress: schedule/dispatch only.
  labeler-smoke:
    name: Proof-Carrying Labeler (push smoke)
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: >
      needs.resolve-suite.outputs.run_labeler == 'true'
      && needs.resolve-suite.outputs.full_suite != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Labeler Smoke Tests
        run: |
          cd runtime/labeler
          cargo test test_labeler_polyglot_handling -- --nocapture
          cargo test test_labeler_deep_nesting -- --nocapture

  labeler-stress:
    name: Proof-Carrying Labeler Stress Test
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.full_suite == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Labeler Stress Tests
        run: |
          cd runtime/labeler
          cargo test test_labeler_stress_1k_randomized_payloads -- --nocapture
          cargo test test_labeler_polyglot_handling -- --nocapture
          cargo test test_labeler_deep_nesting -- --nocapture

      - name: Verify 1k Payloads Processed
        run: |
          cd runtime/labeler
          cargo test test_labeler_stress_1k_randomized_payloads -- --nocapture 2>&1 | grep -q "Generated 1000 randomized payloads" || exit 1

  # Prompt 75: Labeled Alphabet & Plan-DSL Integration
  events-plan-dsl:
    name: Events & Plan-DSL Integration
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.run_sidecar == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Events & Plan-DSL Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_event_mediation_success -- --nocapture
          cargo test test_event_mediation_missing_field_commitments -- --nocapture
          cargo test test_event_mediation_hash_mismatches -- --nocapture
          cargo test test_event_mediation_no_matching_plan_node -- --nocapture
          cargo test test_event_mediation_security_label_escalation -- --nocapture
          cargo test test_event_mediation_field_commitment_validation -- --nocapture
          cargo test test_event_mediation_args_hash_validation -- --nocapture

  # Prompt 76: Declassification Engine
  declassify-engine:
    name: Declassification Engine
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.run_sidecar == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Declassification Engine Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_declassify_engine_basic_operations -- --nocapture
          cargo test test_declassify_engine_cycle_detection -- --nocapture
          cargo test test_declassify_engine_silent_label_widening -- --nocapture
          cargo test test_declassify_engine_well_formed_delta_structures -- --nocapture
          cargo test test_declassify_engine_denial_without_matching_rules -- --nocapture
          cargo test test_declassify_engine_expiry_handling -- --nocapture
          cargo test test_declassify_engine_approval_workflow -- --nocapture
          cargo test test_declassify_engine_justification_validation -- --nocapture

  # Prompt 77: Rate Limits (full suite only — includes p99 perf gate)
  rate-limits:
    name: Rate Limits Performance
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.full_suite == 'true'
    env:
      PF_SHADOW_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Rate Limit Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_rate_limiter_basic -- --nocapture
          cargo test test_optimized_rate_limiter -- --nocapture
          cargo test test_99th_percentile_performance -- --nocapture
          cargo test test_clock_wraparound_safety -- --nocapture
          cargo test test_monotonicity_guarantee -- --nocapture

      - name: Verify Performance Targets
        run: |
          cd runtime/sidecar-watcher
          cargo test test_99th_percentile_performance -- --nocapture | grep -q "99th percentile check cost.*< 1ms" || exit 1

  # Prompt 78: Hardened Adapters + OS Enforcement (full suite only)
  hardened-adapters:
    name: Hardened Adapters & OS Enforcement
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.full_suite == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Hardened Adapters Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_http_get_adapter_hardening -- --nocapture
          cargo test test_file_read_adapter_hardening -- --nocapture
          cargo test test_seccomp_profile_enforcement -- --nocapture
          cargo test test_network_namespace_isolation -- --nocapture
          cargo test test_redirect_attempt_prevention -- --nocapture
          cargo test test_symlink_traversal_prevention -- --nocapture
          cargo test test_file_metadata_recording -- --nocapture
          cargo test test_content_length_enforcement -- --nocapture
          cargo test test_fixed_dns_enforcement -- --nocapture
          cargo test test_readonly_filesystem_enforcement -- --nocapture

  # Prompt 79: Local NI Monitor + Egress Certificate (full suite — 10k prefixes)
  ni-monitor-egress:
    name: NI Monitor & Egress Certificate
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.full_suite == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run NI Monitor & Egress Certificate Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_ni_monitor_verdict_consistency -- --nocapture
          cargo test test_egress_certificate_validation -- --nocapture
          cargo test test_egress_certificate_schema_validation -- --nocapture
          cargo test test_egress_certificate_dsse_signature -- --nocapture
          cargo test test_egress_certificate_export_import -- --nocapture
          cargo test test_egress_certificate_expiry_handling -- --nocapture

      - name: Verify 10k Prefixes Processed
        run: |
          cd runtime/sidecar-watcher
          cargo test --lib test_ni_monitor_verdict_consistency -- --nocapture 2>&1 | grep -q "Processed 10000 prefixes" || exit 1

  # Prompt 80: Cryptographic Envelope + Rekor/TUF + M-of-N Break-Glass
  crypto-envelope-break-glass:
    name: Cryptographic Envelope & Break-Glass
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.run_sidecar == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Cryptographic Envelope & Break-Glass Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_break_glass_m_of_n_signatures -- --nocapture
          cargo test test_break_glass_signature_validation -- --nocapture
          cargo test test_break_glass_post_mortem_stub_emission -- --nocapture
          cargo test test_break_glass_urgency_levels -- --nocapture
          cargo test test_break_glass_expiry_and_auto_paging -- --nocapture
          cargo test test_break_glass_audit_logging -- --nocapture
          cargo test test_break_glass_statistics -- --nocapture

  # Prompt 81: Scheduler & Clock Model (full suite only — long concurrency stress)
  scheduler-clock:
    name: Scheduler & Clock Model
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.full_suite == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-sidecar-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sidecar-

      - name: Run Scheduler & Clock Model Tests
        run: |
          set -o pipefail
          : > scheduler-test.log
          for t in test_concurrency_stress_with_priority_mixing test_two_queue_concurrency_stress; do
            cargo test -p sidecar-watcher "$t" -- --nocapture 2>&1 | tee -a scheduler-test.log
          done
          grep -q "0 reorder violations" scheduler-test.log

  # Prompt 82: Replay Determinism & Drift Detector
  replay-determinism:
    name: Replay Determinism & Drift Detection
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.run_sidecar == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Replay Determinism Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_replay_determinism_verification -- --nocapture
          cargo test test_replay_drift_detection -- --nocapture
          cargo test test_redaction_equivalent_view -- --nocapture

  # Prompt 83: Safety Case Bundle
  safety-case-bundle:
    name: Safety Case Bundle
    runs-on: ubuntu-latest
    needs: resolve-suite
    if: needs.resolve-suite.outputs.run_sidecar == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Safety Case Bundle Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test test_safety_case_bundle_creation -- --nocapture
          cargo test test_safety_case_bundle_storage -- --nocapture
          cargo test test_safety_case_bundle_retention -- --nocapture
          cargo test test_safety_case_bundle_schema_validation -- --nocapture
          cargo test test_safety_case_bundle_compression -- --nocapture
          cargo test test_safety_case_bundle_export_import -- --nocapture
          cargo test test_safety_case_bundle_statistics -- --nocapture
          cargo test test_safety_case_bundle_cleanup -- --nocapture

      - name: Verify 100% Sessions Have Bundles
        run: |
          cd runtime/sidecar-watcher
          cargo test --lib test_safety_case_bundle_storage -- --nocapture 2>&1 | grep -q "100% sessions have bundles" || exit 1

  # Integration Tests — push runs after core shard; nightly after full suite.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PF_SHADOW_MODE: "1"
    needs:
      [
        resolve-suite,
        dfa-equivalence,
        labeler-smoke,
        labeler-stress,
        events-plan-dsl,
        declassify-engine,
        rate-limits,
        hardened-adapters,
        ni-monitor-egress,
        crypto-envelope-break-glass,
        scheduler-clock,
        replay-determinism,
        safety-case-bundle,
      ]
    # Sidecar integration only when sidecar paths changed (or full suite).
    # Skipped heavy deps must not block; ran deps must succeed.
    if: |
      always()
      && needs.resolve-suite.result == 'success'
      && needs.resolve-suite.outputs.run_sidecar == 'true'
      && (needs.dfa-equivalence.result == 'success' || needs.dfa-equivalence.result == 'skipped')
      && (needs.labeler-smoke.result == 'success' || needs.labeler-smoke.result == 'skipped')
      && (needs.labeler-stress.result == 'success' || needs.labeler-stress.result == 'skipped')
      && (needs.events-plan-dsl.result == 'success' || needs.events-plan-dsl.result == 'skipped')
      && (needs.declassify-engine.result == 'success' || needs.declassify-engine.result == 'skipped')
      && (needs.rate-limits.result == 'success' || needs.rate-limits.result == 'skipped')
      && (needs.hardened-adapters.result == 'success' || needs.hardened-adapters.result == 'skipped')
      && (needs.ni-monitor-egress.result == 'success' || needs.ni-monitor-egress.result == 'skipped')
      && (needs.crypto-envelope-break-glass.result == 'success' || needs.crypto-envelope-break-glass.result == 'skipped')
      && (needs.scheduler-clock.result == 'success' || needs.scheduler-clock.result == 'skipped')
      && (needs.replay-determinism.result == 'success' || needs.replay-determinism.result == 'skipped')
      && (needs.safety-case-bundle.result == 'success' || needs.safety-case-bundle.result == 'skipped')
      && needs.dfa-equivalence.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Integration Tests
        run: |
          cd runtime/sidecar-watcher
          cargo test --test integration_tests -- --nocapture

      - name: Verify All Tests Pass
        run: |
          cd runtime/sidecar-watcher
          cargo test --test integration_tests -- --nocapture | grep -q "test result: ok" || exit 1

  # Performance Benchmarks (full suite only)
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [resolve-suite, integration]
    if: >
      always()
      && needs.resolve-suite.outputs.full_suite == 'true'
      && needs.integration.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Performance Benchmarks
        run: cargo bench -p provability-fabric-bench -- --quick --output-format=json | tee performance_report.json

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance_report.json

  # Security Audit (full suite only)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [resolve-suite, integration]
    if: >
      always()
      && needs.resolve-suite.outputs.full_suite == 'true'
      && needs.integration.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run Security Audit
        run: |
          set +e
          # Workspace-root Cargo.lock (sidecar-watcher has no package lockfile).
          cargo audit --json > security_report.json
          audit_status=$?
          set -e
          # Exit 2 = operational failure (missing lockfile / tool error).
          # Exit 1 = advisories found; report is still uploaded for review.
          if [ "$audit_status" -eq 2 ]; then exit 2; fi

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security_report.json

  # Documentation Generation (full suite only)
  documentation:
    name: Documentation Generation
    runs-on: ubuntu-latest
    needs: [resolve-suite, integration]
    if: >
      always()
      && needs.resolve-suite.outputs.full_suite == 'true'
      && needs.integration.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Generate Documentation
        run: |
          cd runtime/sidecar-watcher
          cargo doc --all-features --no-deps
          cargo test --doc --all-features

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: runtime/sidecar-watcher/target/doc

  # Final Status Check
  final-status:
    name: Final Status Check
    runs-on: ubuntu-latest
    needs:
      [
        resolve-suite,
        labeler-smoke,
        labeler-stress,
        integration,
        performance,
        security-audit,
        documentation,
      ]
    if: |
      always()
      && needs.resolve-suite.result == 'success'
      && (needs.labeler-smoke.result == 'success' || needs.labeler-smoke.result == 'skipped')
      && (needs.labeler-stress.result == 'success' || needs.labeler-stress.result == 'skipped')
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      && (
        needs.integration.result == 'success'
        || needs.labeler-smoke.result == 'success'
        || needs.labeler-stress.result == 'success'
      )
      && (
        needs.resolve-suite.outputs.full_suite != 'true'
        || (
          needs.performance.result == 'success'
          && needs.security-audit.result == 'success'
          && needs.documentation.result == 'success'
        )
      )
    steps:
      - name: All Gates Passed
        run: |
          echo "Paper Conformance CI gates passed (suite=${{ needs.resolve-suite.outputs.full_suite == 'true' && 'full' || 'push-shard' }})."
          echo "DFA Round-trip Equivalence: core gate"
          echo "Labeler: push smoke or full 1k stress (nightly)"
          echo "Events & Plan-DSL / Declassify / Break-Glass / Replay / Safety Case: push shard"
          echo "Rate Limits / Hardened Adapters / NI 10k / Scheduler / Perf / Audit / Docs: full suite only"
