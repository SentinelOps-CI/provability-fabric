# SPDX-License-Identifier: Apache-2.0
# Candidate-only locked migration qualification; remove after integration.
name: Direct Reqwest migration candidate

on:
  pull_request:
    branches:
      - security/rust-combined-remediation-20261124
      - main
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'runtime/egress-firewall/Dockerfile'
      - '.github/workflows/reqwest-migration-candidate.yml'

permissions:
  contents: read

jobs:
  lean-dfa-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Provision repository Lean toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          TOOLCHAIN=$(tr -d '\n\r' < lean-toolchain)
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          "$HOME/.elan/bin/elan" override set "$TOOLCHAIN"
      - name: Check refinement theorems and regenerate transition matrix
        run: |
          set -euo pipefail
          lean --version
          lean -DwarningAsError=true --run core/lean-libs/Runtime/DFAIndex.lean /tmp/pf-dfa-matrix.tsv | tee /tmp/pf-dfa-axioms.txt
          for theorem in row_refines_scan code_refines_row encoded_refines_scan trace_refinement; do
            grep -F "PF.Runtime.DFAIndex.$theorem" /tmp/pf-dfa-axioms.txt
          done
          if grep -Fq sorryAx /tmp/pf-dfa-axioms.txt; then
            exit 1
          fi
          cmp /tmp/pf-dfa-matrix.tsv runtime/sidecar-watcher/tests/fixtures/dfa_lean_matrix.tsv
          test "$(wc -l < /tmp/pf-dfa-matrix.tsv)" -eq 40
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev pkg-config libssl-dev protobuf-compiler
      - name: Inspect locked direct HTTP client migration
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /tmp/pf-reqwest-metadata.json
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          data = json.loads(Path("/tmp/pf-reqwest-metadata.json").read_text())
          packages = {p["id"]: p for p in data["packages"]}
          nodes = {n["id"]: n for n in data["resolve"]["nodes"]}
          expected = {"egress-firewall", "httpget-adapter", "jwks-manager", "kms-proxy",
                      "retrieval-gateway", "sidecar-watcher", "telemetry-service", "tool-broker"}
          workspace = {packages[i]["name"]: i for i in data["workspace_members"]}
          for name in expected:
              deps = [d for d in nodes[workspace[name]]["deps"] if d["name"] == "reqwest"]
              assert len(deps) == 1, (name, deps)
              assert packages[deps[0]["pkg"]]["version"] == "0.12.28", (name, deps)
          # Direct servers use the already locked Axum 0.7 / Hyper 1 graph.
          for name in ("jwks-manager", "kms-proxy", "telemetry-service", "sidecar-watcher"):
              deps = nodes[workspace[name]]["deps"]
              assert not any(d["name"] == "hyper" for d in deps), name
              axum = [d for d in deps if d["name"] == "axum"]
              assert len(axum) == 1 and packages[axum[0]["pkg"]]["version"] == "0.7.9", (name, axum)
              assert "http2" in nodes[axum[0]["pkg"]]["features"], name
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          versions = {}
          for p in lock["package"]:
              versions.setdefault(p["name"], set()).add(p["version"])
          for name, version in [
              ("wasmtime", "36.0.22"), ("sqlx", "0.8.6"), ("tokio", "1.53.3"),
              ("openssl", "0.10.80"), ("actix-web", "4.20.0"), ("actix-http", "3.22.0"),
              ("url", "2.5.9"), ("anyhow", "1.0.103"), ("time", "0.3.47"),
              ("libseccomp", "0.4.0"), ("cookie", "0.18.3"),
          ]:
              assert versions.get(name) == {version}, (name, versions.get(name))
          assert versions.get("reqwest") == {"0.12.28"}, versions.get("reqwest")
          schema_ids = [i for i, p in packages.items() if p["name"] == "jsonschema"]
          assert len(schema_ids) == 1
          schema_node = nodes[schema_ids[0]]
          assert "resolve-http" not in schema_node["features"]
          assert "resolve-file" in schema_node["features"]
          assert not any(d["name"] == "reqwest" for d in schema_node["deps"])
          assert "humantime" not in versions
          assert "0.17.0" not in versions.get("nix", set())
          assert "1.0.12" in versions.get("webpki-roots", set())
          new_h2 = [tuple(map(int, v.split("."))) for v in versions.get("h2", set()) if v.startswith("0.4.")]
          assert new_h2 and all(v >= (0, 4, 16) for v in new_h2), new_h2
          # Kubernetes, Actix and Tonic still have legacy HTTP/TLS paths.
          PY
          git diff --exit-code -- Cargo.lock
          cp Cargo.lock /tmp/pf-reqwest-resolved.lock
      - name: Preserve native candidate lockfile
        uses: actions/upload-artifact@v4
        with:
          name: reqwest-migration-native-Cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Compile all eight clients
        id: compile
        run: |
          set -euo pipefail
          cargo test --locked --lib --bins --no-run \
            -p egress-firewall -p httpget-adapter -p jwks-manager -p kms-proxy \
            -p retrieval-gateway -p sidecar-watcher -p telemetry-service -p tool-broker
      - name: Run targeted sidecar regressions
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s cargo test --locked -p sidecar-watcher --lib queue_manager::tests::
          cargo test --locked -p sidecar-watcher --lib cert_v1::tests::schema_validation_
          timeout --kill-after=10s 180s cargo test --locked -p sidecar-watcher --lib ni_monitor::tests::
          cargo test --locked -p sidecar-watcher --lib egress_cert::tests::
          cargo test --locked -p sidecar-watcher --test dfa_equiv
          cargo test --locked -p sidecar-watcher --test ni_monitor_egress
          cargo test --locked -p sidecar-watcher --bin sidecar-watcher test_local_ni_verdict_does_not_establish_permission_evidence
      - name: Qualify migrated HTTP interfaces over loopback
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked -p jwks-manager -p kms-proxy -p telemetry-service --bins test_loopback_dispatch_and_body_limit -- --nocapture
          cargo test --locked -p sidecar-watcher --bin sidecar-watcher test_metrics_http_loopback -- --nocapture
      - name: Run full native functional suites
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          timeout --kill-after=10s 300s cargo test --locked --lib --bins --no-fail-fast \
            -p egress-firewall -p httpget-adapter -p jwks-manager -p kms-proxy \
            -p retrieval-gateway -p sidecar-watcher -p telemetry-service -p tool-broker
      - name: Run runtime observation tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p sidecar-watcher --test runtime_observation_tests
      - name: Run firewall tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked -p egress-firewall --no-default-features
      - name: Run seccomp and executable adapter tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked -p fileread-adapter --features seccomp --bin fileread-adapter
          cargo test --locked -p httpget-adapter --features seccomp --bin httpget-adapter
          cargo build --locked -p fileread-adapter --features seccomp
          cargo build --locked -p httpget-adapter --features seccomp
          python3 tests/test_adapter_seccomp_cli.py
      - name: Build the actual Alpine firewall image
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker build -f runtime/egress-firewall/Dockerfile -t pf-egress-reqwest:ci .
          docker run --rm --entrypoint /bin/sh pf-egress-reqwest:ci -ec '
            test -s /usr/share/doc/egress-firewall/third-party-licenses/webpki-roots-1.0.12.LICENSE
            grep -F "Community Data License Agreement" /usr/share/doc/egress-firewall/third-party-licenses/webpki-roots-1.0.12.LICENSE
            test -x /app/egress-firewall
          '
          cmp /tmp/pf-reqwest-resolved.lock Cargo.lock
      - name: Enforce original sidecar timing thresholds in release mode
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          lscpu
          # Single test thread avoids concurrent timing tests competing for CPU.
          # No threshold changes and no continue-on-error.
          cargo test --release --locked -p sidecar-watcher --lib test_performance_benchmark -- --test-threads=1 --nocapture
          git diff --exit-code -- Cargo.lock
