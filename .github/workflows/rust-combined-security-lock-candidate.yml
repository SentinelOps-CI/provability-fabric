# SPDX-License-Identifier: Apache-2.0
name: Combined Rust security resolver

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'security/rust-combined-remediation-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Resolve combined security dependency graph
        run: |
          set -euo pipefail
          cargo update -p sqlx --precise 0.8.6
          cargo update -p tokio --precise 1.53.3
          cargo update -p openssl --precise 0.10.80
          cargo update -p actix-web --precise 4.20.0
          cargo update -p actix-http --precise 3.22.0
          cargo update -p cookie@0.18.1 --precise 0.18.3
          cargo update -p url --precise 2.5.9
          cargo update -p anyhow --precise 1.0.103
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- . ':!Cargo.lock'
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock
      - name: Validate target versions and absent legacy sandbox graph
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          versions = {}
          for p in packages:
              versions.setdefault(p["name"], set()).add(p["version"])
          targets = {
              "wasmtime": "36.0.22", "sqlx": "0.8.6",
              "tokio": "1.53.3", "openssl": "0.10.80",
              "actix-web": "4.20.0", "actix-http": "3.22.0",
              "url": "2.5.9", "anyhow": "1.0.103",
          }
          for package, version in targets.items():
              assert versions.get(package) == {version}, (package, versions.get(package))
          assert "0.18.3" in versions.get("cookie", set())
          assert "0.18.1" not in versions.get("cookie", set())
          for package in ("wasmtime-wasi", "wasi-common", "wiggle", "wasi-cap-std-sync"):
              assert package not in versions, package
          for package in ("rustls", "rustls-webpki", "webpki-roots", "h2", "cookie", "zstd-safe", "rand"):
              print(package, sorted(versions.get(package, set())))
          PY
      - name: Preserve resolver-produced lockfile
        uses: actions/upload-artifact@v4
        with:
          name: combined-rust-security-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
      - name: Run locked sandbox and retrieval tests
        run: cargo test --locked -p wasm-sandbox -p retrieval-gateway
      - name: Build and exercise the actual sandbox CLI
        run: |
          cargo build --locked -p wasm-sandbox
          python3 tests/test_wasm_sandbox_cli.py --executable target/debug/wasm-sandbox
