# SPDX-License-Identifier: Apache-2.0
name: WebAssembly Security Scan

on:
  pull_request:
    paths:
      - "runtime/wasm-sandbox/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "tests/test_wasm_sandbox_cli.py"
      - ".github/workflows/wasm-scan.yaml"
  push:
    branches: [main]
    paths:
      - "runtime/wasm-sandbox/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "tests/test_wasm_sandbox_cli.py"
      - ".github/workflows/wasm-scan.yaml"

permissions:
  contents: read

jobs:
  scan-wasm-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Run sandbox regression tests
        run: cargo test --locked -p wasm-sandbox
      - name: Build actual CLI
        run: cargo build --locked -p wasm-sandbox
      - name: Exercise deterministic binary guests
        run: python3 tests/test_wasm_sandbox_cli.py --executable target/debug/wasm-sandbox

  verify-witness-output:
    runs-on: ubuntu-latest
    needs: scan-wasm-modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Build actual CLI
        run: cargo build --locked -p wasm-sandbox
      - name: Verify result schema and absence of fabricated proof witnesses
        run: python3 tests/test_wasm_sandbox_cli.py --executable target/debug/wasm-sandbox
