#
# Extended CI (red-team / perf inspect / non-Kind integration / DSSE).
# Kind admission paths are owned by integration.yaml (path-gated).
# E3 owns reusable-ci-rust / reusable-ci-go-node / ci.yml — do not fold those here.

on:
  workflow_call:
    inputs:
      impacted_tests:
        type: string
        required: false
        default: ""

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python tests
        uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.11"
          packages: pytest

      - name: Run red-team tests (impacted only)
        env:
          IMPACTED_TESTS: ${{ inputs.impacted_tests }}
        run: |
          pip install -r tests/redteam/requirements.txt
          if [ -n "$IMPACTED_TESTS" ]; then
            echo "Running impacted red-team tests: $IMPACTED_TESTS"
            for test in $IMPACTED_TESTS; do
              if [[ "$test" == *"redteam"* ]]; then
                python "$test"
              fi
            done
          else
            python tests/redteam/injection_runner.py --offline
            python tests/redteam/abac_fuzz.py --queries 50 --offline
          fi

      - name: Run performance tests (impacted only)
        env:
          IMPACTED_TESTS: ${{ inputs.impacted_tests }}
        run: |
          K6_VERSION="v0.47.0"
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo cp "k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6

          if [ -n "$IMPACTED_TESTS" ]; then
            for test in $IMPACTED_TESTS; do
              if [[ "$test" == *"perf"* ]]; then
                k6 run "$test"
              fi
            done
          else
            k6 inspect tests/perf/latency_k6.js
          fi

      # Pytest shard: non-Kind integration only. Kind/admission stays in integration.yaml.
      - name: Run integration tests (impacted only; skip Kind admission)
        env:
          IMPACTED_TESTS: ${{ inputs.impacted_tests }}
        run: |
          pip install -r tests/integration/requirements.txt
          if [ -n "$IMPACTED_TESTS" ]; then
            k8s_tests=""
            for test in $IMPACTED_TESTS; do
              case "$test" in
                *test_happy_path.py|*test_violation_path.py)
                  echo "Skipping k8s integration test in ci-extended: $test"
                  ;;
                *)
                  k8s_tests="$k8s_tests $test"
                  ;;
              esac
            done
            if [ -n "$k8s_tests" ]; then
              timeout 20m pytest $k8s_tests -v
            else
              echo "No non-k8s impacted integration tests to run"
            fi
          else
            timeout 20m pytest tests/integration/ -v \
              --ignore=tests/integration/test_happy_path.py \
              --ignore=tests/integration/test_violation_path.py
          fi

      - name: Set up Node workspace (DSSE TypeScript)
        uses: ./.github/actions/setup-node-workspace
        with:
          node-version: "20"
          working-directory: core/crypto/dsse-ts

      - name: Run cross-language DSSE tests (F01)
        run: python tests/crypto/test_cross_lang_dsse.py

      - name: Sign spec bundles
        if: github.event_name == 'push'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          COSIGN_VERSION="v2.4.0"
          curl -fsSL -o cosign-bin "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x cosign-bin
          sudo mv cosign-bin /usr/local/bin/cosign

          if [ -d "bundles" ]; then
            # ci-honesty: justified wave7-remediation
            SIG_FILES=$(find bundles -name "spec.sig" 2>/dev/null || true)
            if [ -n "$SIG_FILES" ]; then
              find bundles -name "spec.sig" -exec cosign sign-blob --bundle {}.bundle {} \;
            fi
          fi
