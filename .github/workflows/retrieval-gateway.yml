name: Retrieval Gateway

on:
  push:
    branches: [main, master]
    paths:
      - "runtime/retrieval-gateway/**"
      - "core/crypto/dsse-rs/**"
      - "core/crypto/dsse/**"
      - "core/crypto/dsse-ts/**"
      - "tests/fixtures/crypto/**"
      - "tests/test_retrieval_result_commitment_v2.py"
      - "docs/security/retrieval-result-commitment-v2.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/retrieval-gateway.yml"
  pull_request:
    paths:
      - "runtime/retrieval-gateway/**"
      - "core/crypto/dsse-rs/**"
      - "core/crypto/dsse/**"
      - "core/crypto/dsse-ts/**"
      - "tests/fixtures/crypto/**"
      - "tests/test_retrieval_result_commitment_v2.py"
      - "docs/security/retrieval-result-commitment-v2.md"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  build-test:
    name: Build and test retrieval-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"

      - name: Cache cargo
        uses: ./.github/actions/cache-cargo
        with:
          key-suffix: "-retrieval-gateway"

      - name: Locked retrieval gateway build and tests
        run: |
          cargo build --locked -p retrieval-gateway
          cargo test --locked -p retrieval-gateway
          git diff --exit-code -- Cargo.lock

      - name: Verify packaged certificate-root license texts
        run: |
          set -euo pipefail
          docker build -f runtime/retrieval-gateway/Dockerfile -t pf-retrieval-licenses:ci .
          docker run --rm --entrypoint /bin/sh pf-retrieval-licenses:ci -ec '
            dir=/usr/share/doc/retrieval-gateway/third-party-licenses
            for version in 0.26.11 1.0.12; do
              test -s "$dir/webpki-roots-$version.LICENSE"
              grep -F "Community Data License Agreement" "$dir/webpki-roots-$version.LICENSE"
            done
          '

      - name: Independently verify versioned receipt commitment vectors
        run: python3 -m unittest discover -s tests -p 'test_retrieval_result_commitment_v2.py' -v

      - name: Set up Go receipt verifier
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Verify signed v2 receipt in Go
        run: cd core/crypto/dsse && go test ./...

      - name: Set up Node receipt verifier
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify signed v2 receipt in TypeScript
        run: |
          cd core/crypto/dsse-ts
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run build
          npm test -- --runInBand
