name: Cross-Region Disaster Recovery Test

# Gated floor: moto/local AWS surface on push/PR/schedule (inventory-safe).
# Live AWS: workflow_dispatch mode=live only; fail-closed without secrets.
# CI-local proof does not claim production multi-region DR.
on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/dr-cross.yaml"
      - "scripts/db/blue_green_migrate.sh"
      - "scripts/dr/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/dr-cross.yaml"
      - "scripts/db/blue_green_migrate.sh"
      - "scripts/dr/**"
  schedule:
    # Monday moto gate only — does not auto-run live AWS when secrets appear.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "moto (CI-local) or live (real AWS; secrets required)"
        required: false
        default: "moto"
        type: choice
        options: [moto, live]
      simulate_failover:
        description: "Live mode: disable primary health check to exercise failover"
        required: false
        default: true
        type: boolean
      test_duration:
        description: "Test duration in seconds"
        required: false
        default: "300"
        type: string

env:
  AWS_REGION: us-west-2
  PRIMARY_REGION: us-west-2
  SECONDARY_REGION: us-east-1
  DNS_ZONE_ID: ${{ secrets.DNS_ZONE_ID }}
  DNS_RECORD: db.provability-fabric.org
  HEALTH_CHECK_ID: ${{ secrets.HEALTH_CHECK_ID }}

jobs:
  # ---------------------------------------------------------------------------
  # Gated CI-local floor (push / PR / schedule / dispatch mode=moto)
  # ---------------------------------------------------------------------------
  local-dr-proof:
    name: CI-local DR proof (moto)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.mode == 'moto'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install moto + boto3
        run: pip install 'moto[s3,route53]>=5.0' boto3

      - name: Run moto cross-region DR smoke
        env:
          DR_SMOKE_REPORT: reports/dr/moto-dr-smoke.json
        run: |
          chmod +x scripts/db/blue_green_migrate.sh
          python scripts/dr/moto_dr_smoke.py
          test -f reports/dr/moto-dr-smoke.json
          python3 - <<'PY'
          import json
          r = json.load(open("reports/dr/moto-dr-smoke.json", encoding="utf-8"))
          assert r.get("live_aws") is False
          assert r.get("replica_bytes", 0) > 0
          assert r.get("dns_after_failover")
          print("report assertions ok")
          PY

      - name: Upload moto DR report
        uses: actions/upload-artifact@v4
        with:
          name: moto-dr-smoke-report
          path: reports/dr/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Live AWS path (dispatch mode=live only; fail-closed without secrets)
  # Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  #   DNS_ZONE_ID, HEALTH_CHECK_ID
  # RDS endpoints resolved via describe-db-instances (primary/secondary).
  # ---------------------------------------------------------------------------
  live-setup:
    name: Live DR setup (fail-closed)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
    outputs:
      primary_endpoint: ${{ steps.get_endpoints.outputs.primary_endpoint }}
      secondary_endpoint: ${{ steps.get_endpoints.outputs.secondary_endpoint }}
      sidecar_url: ${{ steps.get_endpoints.outputs.sidecar_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Live DR preflight (secrets required)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DNS_ZONE_ID: ${{ secrets.DNS_ZONE_ID }}
          HEALTH_CHECK_ID: ${{ secrets.HEALTH_CHECK_ID }}
          DR_LIVE_PREFLIGHT_REPORT: reports/dr/live-dr-preflight.json
        run: |
          python3 scripts/dr/live_dr_preflight.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get database endpoints
        id: get_endpoints
        run: |
          set -euo pipefail
          PRIMARY_ENDPOINT=$(aws rds describe-db-instances \
            --region ${{ env.PRIMARY_REGION }} \
            --db-instance-identifier provability-fabric-primary \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          if [ -z "$PRIMARY_ENDPOINT" ] || [ "$PRIMARY_ENDPOINT" = "None" ]; then
            echo "error: could not resolve primary RDS endpoint" >&2
            exit 1
          fi
          echo "primary_endpoint=$PRIMARY_ENDPOINT" >> "$GITHUB_OUTPUT"

          SECONDARY_ENDPOINT=$(aws rds describe-db-instances \
            --region ${{ env.SECONDARY_REGION }} \
            --db-instance-identifier provability-fabric-secondary \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          if [ -z "$SECONDARY_ENDPOINT" ] || [ "$SECONDARY_ENDPOINT" = "None" ]; then
            echo "error: could not resolve secondary RDS endpoint" >&2
            exit 1
          fi
          echo "secondary_endpoint=$SECONDARY_ENDPOINT" >> "$GITHUB_OUTPUT"

          SIDECAR_URL="https://sidecar.provability-fabric.org"
          echo "sidecar_url=$SIDECAR_URL" >> "$GITHUB_OUTPUT"

      - name: Upload live preflight
        uses: actions/upload-artifact@v4
        with:
          name: live-dr-preflight
          path: reports/dr/
          retention-days: 30

  test-failover:
    name: Test Region Failover (live)
    runs-on: ubuntu-latest
    needs: live-setup
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
    strategy:
      matrix:
        test_scenario: [normal, failover, recovery]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq postgresql-client dnsutils

      - name: Require live endpoints
        run: |
          set -euo pipefail
          test -n "${{ needs.live-setup.outputs.primary_endpoint }}"
          test -n "${{ needs.live-setup.outputs.secondary_endpoint }}"
          test -n "${{ env.DNS_ZONE_ID }}"
          test -n "${{ env.HEALTH_CHECK_ID }}"

      - name: Test normal operation
        if: matrix.test_scenario == 'normal'
        run: |
          set -euo pipefail
          echo "Testing normal operation against live primary..."
          if ! pg_isready -h ${{ needs.live-setup.outputs.primary_endpoint }} -p 5432; then
            echo "Primary database is not accessible"
            exit 1
          fi
          for i in {1..10}; do
            if curl -f -s "${{ needs.live-setup.outputs.sidecar_url }}/health" > /dev/null; then
              echo "Sidecar heartbeat successful"
              break
            else
              if [ "${i}" -eq 10 ]; then
                echo "All sidecar heartbeat attempts failed"
                exit 1
              fi
              sleep 5
            fi
          done
          RESOLVED_IP=$(dig +short ${{ env.DNS_RECORD }} | head -1)
          if [ -z "$RESOLVED_IP" ]; then
            echo "DNS resolution failed"
            exit 1
          fi

      - name: Live failover (disable primary health check)
        if: matrix.test_scenario == 'failover' && github.event.inputs.simulate_failover == 'true'
        run: |
          set -euo pipefail
          aws route53 update-health-check \
            --health-check-id ${{ env.HEALTH_CHECK_ID }} \
            --disabled
          sleep 60
          for i in {1..30}; do
            RESOLVED_IP=$(dig +short ${{ env.DNS_RECORD }} | head -1)
            SECONDARY_IP=$(dig +short ${{ needs.live-setup.outputs.secondary_endpoint }} | head -1)
            if [ -n "$RESOLVED_IP" ] && [ -n "$SECONDARY_IP" ] && [ "$RESOLVED_IP" = "$SECONDARY_IP" ]; then
              echo "DNS failover successful: $RESOLVED_IP"
              break
            fi
            if [ "${i}" -eq 30 ]; then
              echo "DNS failover timeout"
              exit 1
            fi
            sleep 10
          done

      - name: Test failover operation
        if: matrix.test_scenario == 'failover'
        run: |
          set -euo pipefail
          if ! pg_isready -h ${{ needs.live-setup.outputs.secondary_endpoint }} -p 5432; then
            echo "Secondary database is not accessible"
            exit 1
          fi

      - name: Test recovery
        if: matrix.test_scenario == 'recovery'
        run: |
          set -euo pipefail
          aws route53 update-health-check \
            --health-check-id ${{ env.HEALTH_CHECK_ID }} \
            --no-disabled
          sleep 60
          for i in {1..30}; do
            RESOLVED_IP=$(dig +short ${{ env.DNS_RECORD }} | head -1)
            PRIMARY_IP=$(dig +short ${{ needs.live-setup.outputs.primary_endpoint }} | head -1)
            if [ -n "$RESOLVED_IP" ] && [ -n "$PRIMARY_IP" ] && [ "$RESOLVED_IP" = "$PRIMARY_IP" ]; then
              echo "DNS recovery successful: $RESOLVED_IP"
              break
            fi
            if [ "${i}" -eq 30 ]; then
              echo "DNS recovery timeout"
              exit 1
            fi
            sleep 10
          done

  verify-replication:
    name: Verify Cross-Region Replication (live)
    runs-on: ubuntu-latest
    needs: live-setup
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Test S3 replication
        run: |
          set -euo pipefail
          PRIMARY_BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?contains(Name, \`provability-fabric-dumps\`) && !contains(Name, \`secondary\`)].Name" \
            --output text | awk '{print $1}')
          SECONDARY_BUCKET=$(aws s3api list-buckets \
            --region ${{ env.SECONDARY_REGION }} \
            --query "Buckets[?contains(Name, \`provability-fabric-dumps\`) && contains(Name, \`secondary\`)].Name" \
            --output text | awk '{print $1}')
          if [ -z "$PRIMARY_BUCKET" ] || [ -z "$SECONDARY_BUCKET" ]; then
            echo "error: could not resolve primary/secondary dump buckets" >&2
            exit 1
          fi
          echo "test-content-$(date +%s)" > test-file.txt
          aws s3 cp test-file.txt "s3://$PRIMARY_BUCKET/test-file.txt"
          sleep 60
          if ! aws s3 ls "s3://$SECONDARY_BUCKET/test-file.txt" --region ${{ env.SECONDARY_REGION }} > /dev/null; then
            echo "S3 replication failed"
            exit 1
          fi
          aws s3 rm "s3://$PRIMARY_BUCKET/test-file.txt"
          aws s3 rm "s3://$SECONDARY_BUCKET/test-file.txt" --region ${{ env.SECONDARY_REGION }}

  test-blue-green-migration:
    name: Test Blue-Green Migration (live verify)
    runs-on: ubuntu-latest
    needs: live-setup
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install postgresql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Live blue-green verify (non-simulated connectivity)
        run: |
          set -euo pipefail
          chmod +x ./scripts/db/blue_green_migrate.sh
          ./scripts/db/blue_green_migrate.sh \
            --verify-only \
            --blue-db-url "postgresql://probe@${{ needs.live-setup.outputs.primary_endpoint }}:5432/postgres" \
            --green-db-url "postgresql://probe@${{ needs.live-setup.outputs.secondary_endpoint }}:5432/postgres" \
            --dns-zone "${{ env.DNS_ZONE_ID }}" \
            --dns-record "${{ env.DNS_RECORD }}" \
            --smoke-test-url "${{ needs.live-setup.outputs.sidecar_url }}/health"

  generate-report:
    name: Generate Live DR Test Report
    runs-on: ubuntu-latest
    needs: [live-setup, test-failover, verify-replication, test-blue-green-migration]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'live'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate test report
        run: |
          mkdir -p reports/dr
          report_file="reports/dr/dr-test-report-$(date +%Y%m%d).md"
          cat > "${report_file}" << EOF
          # Cross-Region Disaster Recovery Test Report (live_aws=true)
          **Date:** $(date)
          **Mode:** live
          ### Failover: ${{ needs.test-failover.result }}
          ### Replication: ${{ needs.verify-replication.result }}
          ### Migration: ${{ needs.test-blue-green-migration.result }}
          EOF
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dr-test-report-live
          path: reports/dr/
          retention-days: 30

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [local-dr-proof, live-setup, test-failover, verify-replication, test-blue-green-migration]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "Cross-region DR workflow failed (moto gate or live AWS path)."
