#
# Nightly full Python sweep (PR CI may run a subset via tools/select_impacted.py).

name: CI nightly pytest full

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest kubernetes requests pyyaml psutil flake8-breakpoint
          pip install -r tests/integration/requirements.txt
          pip install -r tests/redteam/requirements.txt

      - name: Run tools and unit-style tests
        run: |
          python -m pytest tools/results/test_summarize.py tools/ci/test_impacted_only.py -v
          cd bench/swebench && python -m pytest test_runner.py -v && cd ../..

      - name: Run red-team suite (offline)
        run: |
          # ci-honesty: justified wave7-remediation
          python tests/redteam/injection_runner.py --corpus tests/redteam/injection_corpus.jsonl --kernel-url http://127.0.0.1:8080 --output /tmp/injection-results.json || true
          # ci-honesty: justified wave7-remediation
          python tests/redteam/abac_fuzz.py || true

      - name: Run integration tests (full tree)
        # ci-honesty: justified wave7-remediation
        continue-on-error: true
        run: timeout 30m pytest tests/integration/ -v --tb=short -m "not kind"
