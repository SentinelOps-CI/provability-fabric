# SPDX-License-Identifier: Apache-2.0
# Proof-Carrying Science v0.1: science-claim verification, signing, and fixtures.

name: PCS CI

on:
  push:
    branches: [main]
    paths:
      - 'adapters/pcs/**'
      - 'core/cli/pf/**'
      - 'config/schemas/pcs/**'
      - 'tests/pcs/**'
      - 'tools/pcs-validate/**'
      - 'scripts/pcs-schema-diff.sh'
      - 'scripts/pcs-pf-clean-chain.sh'
      - 'scripts/pcs-freeze-labtrust-release.sh'
      - 'scripts/pcs-freeze-labtrust-release-invalid.py'
      - 'scripts/pcs-sync-from-pcs-core-rc.py'
      - 'scripts/test-pcs-rc-gate.sh'
      - 'scripts/test-pcs-rc-gate.ps1'
      - 'scripts/_resolve_pf.sh'
      - 'scripts/run-pcs-v01-clean-chain.sh'
      - 'justfile'
      - 'docs/guides/science-claim-verification.md'
      - 'docs/guides/proof-carrying-lab-workflow.md'
      - 'docs/guides/pcs-v01-clean-chain.md'
      - 'docs/releases/**'
      - '.github/workflows/pcs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/pcs/**'
      - 'core/cli/pf/**'
      - 'config/schemas/pcs/**'
      - 'tests/pcs/**'
      - 'tools/pcs-validate/**'
      - 'scripts/pcs-schema-diff.sh'
      - 'scripts/pcs-pf-clean-chain.sh'
      - 'scripts/pcs-freeze-labtrust-release.sh'
      - 'scripts/pcs-freeze-labtrust-release-invalid.py'
      - 'scripts/pcs-sync-from-pcs-core-rc.py'
      - 'scripts/test-pcs-rc-gate.sh'
      - 'scripts/test-pcs-rc-gate.ps1'
      - 'scripts/_resolve_pf.sh'
      - 'scripts/run-pcs-v01-clean-chain.sh'
      - 'justfile'
      - 'docs/guides/science-claim-verification.md'
      - 'docs/guides/proof-carrying-lab-workflow.md'
      - 'docs/guides/pcs-v01-clean-chain.md'
      - 'docs/releases/**'
      - '.github/workflows/pcs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
          sparse-checkout: |
            schemas
            python

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            adapters/pcs/go.sum
            core/cli/pf/go.sum
            tools/pcs-validate/go.sum

      - name: Schema mirror matches pcs-core
        run: bash scripts/pcs-schema-diff.sh pcs-core

      - name: Test PCS adapter
        env:
          PCS_CORE_PATH: ${{ github.workspace }}/pcs-core
        run: |
          cd adapters/pcs
          go test ./... -count=1

      - name: PCS RC fixture lock gate
        env:
          PCS_CORE_PATH: ${{ github.workspace }}/pcs-core
        run: bash scripts/test-pcs-rc-gate.sh

      - name: pf inspect labtrust-release signed fixture
        run: |
          cd core/cli/pf
          go run . inspect science-claim \
            "$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/signed_science_claim_bundle.json" \
            --strict

      - name: pf verify science-claim with HandoffManifest.v0
        run: |
          cd core/cli/pf
          PF_COMMIT="$(python -c "import json;print(json.load(open('$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/FIXTURE_MANIFEST.json'))['pf_source_commit'])")"
          export PF_SOURCE_COMMIT="$PF_COMMIT"
          export PF_RELEASE_MODE=1
          RELEASE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release"
          go run . verify science-claim \
            "$RELEASE/science_claim_bundle.certified.json" \
            --handoff "$RELEASE/handoff_to_pf.json" \
            --registry "$RELEASE/artifact_registry.json" \
            --release-mode

      - name: pf verify release-chain (ReleaseManifest.v0)
        run: |
          pip install -q -e "${{ github.workspace }}/pcs-core/python"
          cd core/cli/pf
          PF_COMMIT="$(python -c "import json;print(json.load(open('$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/FIXTURE_MANIFEST.json'))['pf_source_commit'])")"
          export PF_SOURCE_COMMIT="$PF_COMMIT"
          export PF_RELEASE_MODE=1
          OUT="$RUNNER_TEMP/release_chain_validation_result.json"
          RC_DIR="${{ github.workspace }}/pcs-core/examples/labtrust-release"
          MANIFEST="$RC_DIR/release_manifest.v0.json"
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/release_manifest.json"
          fi
          REGISTRY="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/artifact_registry.json"
          go run . verify release-chain \
            --manifest "$MANIFEST" \
            --registry "$REGISTRY" \
            --artifact-dir "$RC_DIR" \
            --release-mode \
            --out "$OUT"
          pcs validate "$OUT"
          grep -q '"status": "ProofChecked"' "$OUT"
          grep -q 'manifest_hashes_match' "$OUT"
          grep -q 'registry_admission_passed' "$OUT"
          grep -q 'registry_artifact_registered' "$OUT"
          grep -q 'registry_semantic_checks_executed' "$OUT"

      - name: Reject legacy pf_handoff in release mode
        run: |
          cd core/cli/pf
          PF_COMMIT="$(python -c "import json;print(json.load(open('$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/FIXTURE_MANIFEST.json'))['pf_source_commit'])")"
          export PF_SOURCE_COMMIT="$PF_COMMIT"
          export PF_RELEASE_MODE=1
          RELEASE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release"
          if go run . verify science-claim \
            "$RELEASE/science_claim_bundle.certified.json" \
            --handoff "$RELEASE/pf_handoff.json" \
            --registry "$RELEASE/artifact_registry.json" \
            --release-mode; then
            echo "expected legacy pf_handoff to be rejected in release mode"
            exit 1
          fi

      - name: Validate PCS fixtures
        run: |
          cd tools/pcs-validate
          go run . --fixtures ../../tests/pcs

      - name: Test pf PCS CLI
        run: |
          cd core/cli/pf
          go test ./cmd/... -count=1

      - name: PCS v0.1 PF clean-chain segment
        run: |
          export PCS_CORE_PATH="${{ github.workspace }}/pcs-core"
          pip install -q -e "$PCS_CORE_PATH/python"
          WORK="$RUNNER_TEMP/pf-clean-chain"
          mkdir -p "$WORK"
          cp "$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/science_claim_bundle.certified.json" "$WORK/"
          export PF_SOURCE_COMMIT="$(python -c "import json;print(json.load(open('$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/FIXTURE_MANIFEST.json'))['pf_source_commit'])")"
          export PF_RELEASE_MODE=1
          export PF_DETERMINISTIC=1
          export PCS_DETERMINISTIC=1
          bash "$GITHUB_WORKSPACE/scripts/pcs-pf-clean-chain.sh" "$WORK"

      - name: pcs-core validate release artifacts
        run: |
          pip install -q -e pcs-core/python
          RELEASE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release"
          pcs validate "$RELEASE/science_claim_bundle.certified.json"
          pcs validate "$RELEASE/verification_result.json"
          pcs validate "$RELEASE/signed_science_claim_bundle.json"
          pcs validate "$RELEASE/handoff_to_pf.json"
          pcs validate "$RELEASE/release_manifest.json"
          pcs validate "$RELEASE/release_chain_validation_result.json"
          pcs validate "$RELEASE/artifact_registry.json"

      - name: pf validate Phase 2 protocol fixtures
        run: |
          cd core/cli/pf
          RELEASE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release"
          go run . validate handoff-manifest "$RELEASE/handoff_to_pf.json"
          go run . validate release-manifest "$RELEASE/release_manifest.json"
          go run . validate artifact-registry "$RELEASE/artifact_registry.json"
          go run . validate release-chain-result "$RELEASE/release_chain_validation_result.json"

      - name: pf explain failure on rejected fixture
        run: |
          cd core/cli/pf
          RELEASE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release"
          VR="$RUNNER_TEMP/rejected_verification_result.json"
          export PF_RELEASE_MODE=0
          go run . verify science-claim "$RELEASE/invalid_mismatched_trace_hash.json" --out "$VR" || true
          set +e
          go run . explain failure "$VR" 2>&1 | tee "$RUNNER_TEMP/explain_vr.txt"
          EXPLAIN_RC=${PIPESTATUS[0]}
          set -e
          if [ "$EXPLAIN_RC" -eq 0 ]; then
            echo "expected explain failure to exit non-zero"
            exit 1
          fi
          grep -q 'repair:' "$RUNNER_TEMP/explain_vr.txt"

      - name: CLI smoke (verify, sign, inspect)
        run: |
          cd core/cli/pf
          BUNDLE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust/science_claim_bundle.certified.json"
          LABTRUST_SIGNED="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust/signed_science_claim_bundle.labtrust-export.json"
          PF_SIGNED="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust/signed_science_claim_bundle.json"
          OUT="$RUNNER_TEMP/pf_signed.json"
          go run . verify science-claim "$BUNDLE" --json | tee "$RUNNER_TEMP/verify.json"
          grep -q '"status": "ProofChecked"' "$RUNNER_TEMP/verify.json"
          go run . sign science-claim "$BUNDLE" --out "$OUT"
          go run . inspect science-claim "$OUT" --strict | tee "$RUNNER_TEMP/inspect_pf.txt"
          grep -q 'verification_status:  ProofChecked' "$RUNNER_TEMP/inspect_pf.txt"
          grep -q 'science_claim_bundle_schema' "$RUNNER_TEMP/inspect_pf.txt"
          grep -q 'Embedded checks (17):' "$RUNNER_TEMP/inspect_pf.txt"
          go run . inspect science-claim "$PF_SIGNED" --strict | tee "$RUNNER_TEMP/inspect_pf_signed_fixture.txt"
          grep -qE 'Embedded checks \((15|17)\):' "$RUNNER_TEMP/inspect_pf_signed_fixture.txt"
          go run . inspect science-claim "$LABTRUST_SIGNED" --reverify | tee "$RUNNER_TEMP/inspect_labtrust.txt"
          grep -qE 'PF re-verification \((15|17)\):' "$RUNNER_TEMP/inspect_labtrust.txt"

      - name: Reject failed bundle sign
        run: |
          cd core/cli/pf
          if go run . sign science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_missing_certificate.json" --out "$RUNNER_TEMP/bad.json"; then
            echo "expected sign to fail"
            exit 1
          fi

      - name: Reject legacy singular-field bundle
        run: |
          cd core/cli/pf
          if go run . verify science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_legacy_singular_runtime_receipt.json"; then
            echo "expected legacy bundle to fail"
            exit 1
          fi

      - name: Migrate legacy bundle then verify
        run: |
          cd core/cli/pf
          MIG="$RUNNER_TEMP/migrated_science_claim.json"
          go run . migrate science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_legacy_singular_runtime_receipt.json" --out "$MIG"
          go run . verify science-claim "$MIG" --json | tee "$RUNNER_TEMP/migrated_verify.json"
          grep -q '"status": "ProofChecked"' "$RUNNER_TEMP/migrated_verify.json"

      - name: Reject multiple runtime receipts (v0.1)
        run: |
          cd core/cli/pf
          if go run . verify science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_multiple_runtime_receipts.json"; then
            echo "expected multiple runtime_receipts to fail"
            exit 1
          fi
