# SPDX-License-Identifier: Apache-2.0
# Proof-Carrying Science v0.1: science-claim verification, signing, and fixtures.

name: PCS CI

on:
  push:
    branches: [main]
    paths:
      - 'adapters/pcs/**'
      - 'core/cli/pf/**'
      - 'config/schemas/pcs/**'
      - 'tests/pcs/**'
      - 'tools/pcs-validate/**'
      - 'scripts/pcs-schema-diff.sh'
      - 'scripts/pcs-pf-clean-chain.sh'
      - 'scripts/run-pcs-v01-clean-chain.sh'
      - 'justfile'
      - 'docs/guides/science-claim-verification.md'
      - 'docs/guides/proof-carrying-lab-workflow.md'
      - 'docs/guides/pcs-v01-clean-chain.md'
      - '.github/workflows/pcs-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/pcs/**'
      - 'core/cli/pf/**'
      - 'config/schemas/pcs/**'
      - 'tests/pcs/**'
      - 'tools/pcs-validate/**'
      - 'scripts/pcs-schema-diff.sh'
      - 'scripts/pcs-pf-clean-chain.sh'
      - 'scripts/run-pcs-v01-clean-chain.sh'
      - 'justfile'
      - 'docs/guides/science-claim-verification.md'
      - 'docs/guides/proof-carrying-lab-workflow.md'
      - 'docs/guides/pcs-v01-clean-chain.md'
      - '.github/workflows/pcs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: SentinelOps-CI/pcs-core
          path: pcs-core
          sparse-checkout: |
            schemas
            python

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            adapters/pcs/go.sum
            core/cli/pf/go.sum
            tools/pcs-validate/go.sum

      - name: Schema mirror matches pcs-core
        run: bash scripts/pcs-schema-diff.sh pcs-core

      - name: Test PCS adapter
        run: |
          cd adapters/pcs
          go test ./... -count=1

      - name: Validate PCS fixtures
        run: |
          cd tools/pcs-validate
          go run . --fixtures ../../tests/pcs

      - name: Test pf PCS CLI
        run: |
          cd core/cli/pf
          go test ./cmd/... -count=1

      - name: PCS v0.1 PF clean-chain segment
        run: |
          export PCS_CORE_PATH="$GITHUB_WORKSPACE/../pcs-core"
          pip install -q -e "$PCS_CORE_PATH/python"
          export PF_SOURCE_COMMIT=cccccccccccccccccccccccccccccccccccccccc
          bash "$GITHUB_WORKSPACE/scripts/pcs-pf-clean-chain.sh" "$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release"

      - name: pcs-core validate release artifacts
        run: |
          pip install -q -e pcs-core/python
          pcs validate "$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/science_claim_bundle.certified.json"
          pcs validate "$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/verification_result.json"
          pcs validate "$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust-release/signed_science_claim_bundle.json"

      - name: CLI smoke (verify, sign, inspect)
        run: |
          cd core/cli/pf
          BUNDLE="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust/science_claim_bundle.certified.json"
          LABTRUST_SIGNED="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust/signed_science_claim_bundle.labtrust-export.json"
          PF_SIGNED="$GITHUB_WORKSPACE/tests/pcs/fixtures/labtrust/signed_science_claim_bundle.json"
          OUT="$RUNNER_TEMP/pf_signed.json"
          go run . verify science-claim "$BUNDLE" --json | tee "$RUNNER_TEMP/verify.json"
          grep -q '"status": "ProofChecked"' "$RUNNER_TEMP/verify.json"
          go run . sign science-claim "$BUNDLE" --out "$OUT"
          go run . inspect science-claim "$OUT" --strict | tee "$RUNNER_TEMP/inspect_pf.txt"
          grep -q 'verification_status:  ProofChecked' "$RUNNER_TEMP/inspect_pf.txt"
          grep -q 'science_claim_bundle_schema' "$RUNNER_TEMP/inspect_pf.txt"
          grep -q 'Embedded checks (15):' "$RUNNER_TEMP/inspect_pf.txt"
          go run . inspect science-claim "$PF_SIGNED" --strict | tee "$RUNNER_TEMP/inspect_pf_signed_fixture.txt"
          grep -q 'Embedded checks (15):' "$RUNNER_TEMP/inspect_pf_signed_fixture.txt"
          go run . inspect science-claim "$LABTRUST_SIGNED" --reverify | tee "$RUNNER_TEMP/inspect_labtrust.txt"
          grep -q 'PF re-verification (15):' "$RUNNER_TEMP/inspect_labtrust.txt"

      - name: Reject failed bundle sign
        run: |
          cd core/cli/pf
          if go run . sign science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_missing_certificate.json" --out "$RUNNER_TEMP/bad.json"; then
            echo "expected sign to fail"
            exit 1
          fi

      - name: Reject legacy singular-field bundle
        run: |
          cd core/cli/pf
          if go run . verify science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_legacy_singular_runtime_receipt.json"; then
            echo "expected legacy bundle to fail"
            exit 1
          fi

      - name: Migrate legacy bundle then verify
        run: |
          cd core/cli/pf
          MIG="$RUNNER_TEMP/migrated_science_claim.json"
          go run . migrate science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_legacy_singular_runtime_receipt.json" --out "$MIG"
          go run . verify science-claim "$MIG" --json | tee "$RUNNER_TEMP/migrated_verify.json"
          grep -q '"status": "ProofChecked"' "$RUNNER_TEMP/migrated_verify.json"

      - name: Reject multiple runtime receipts (v0.1)
        run: |
          cd core/cli/pf
          if go run . verify science-claim "$GITHUB_WORKSPACE/tests/pcs/invalid_multiple_runtime_receipts.json"; then
            echo "expected multiple runtime_receipts to fail"
            exit 1
          fi
