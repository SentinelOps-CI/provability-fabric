name: Evidence v0.1 smoke
# Path-filter trigger: required for branch-protection smoke + evidence-schema-only on CI-only PRs.

on:
  pull_request:
    paths:
      - 'specs/evidence/**'
      - 'core/evidence/**'
      - 'core/cli/pf/evidence_commands.go'
      - 'core/cli/pf/main.go'
      - 'runtime/sidecar-watcher/src/evidence_v01.rs'
      - 'runtime/sidecar-watcher/src/cert_v1.rs'
      - 'runtime/sidecar-watcher/src/permit_enforcement.rs'
      - 'runtime/sidecar-watcher/tests/emit_evidence_tests.rs'
      - 'testbed/evidence-v0.1/**'
      - 'testbed/evidence-v0.2/**'
      - 'tests/evidence_**/**'
      - 'tests/e2e/test_evidence_bundle_basic.py'
      - 'tests/runtime_evidence/**'
      - 'tests/forensic_replay/**'
      - 'tests/testbed/**'
      - 'tools/cert-validate/validate.py'
      - 'tools/standards/**'
      - 'external/**'
      - '.gitmodules'
      - 'Makefile'
      - 'scripts/check_cert_write_paths.sh'
      - '.github/workflows/evidence-v01-smoke.yml'
      - '.github/actions/setup-python-tests/**'
      - '.github/actions/setup-go-cli/**'
  push:
    branches: [main]
    paths:
      - 'specs/evidence/**'
      - 'core/evidence/**'
      - 'core/cli/pf/evidence_commands.go'
      - 'core/cli/pf/main.go'
      - 'runtime/sidecar-watcher/src/evidence_v01.rs'
      - 'runtime/sidecar-watcher/src/cert_v1.rs'
      - 'runtime/sidecar-watcher/src/permit_enforcement.rs'
      - 'runtime/sidecar-watcher/tests/emit_evidence_tests.rs'
      - 'testbed/evidence-v0.1/**'
      - 'testbed/evidence-v0.2/**'
      - 'tests/evidence_**/**'
      - 'tests/e2e/test_evidence_bundle_basic.py'
      - 'tests/runtime_evidence/**'
      - 'tests/forensic_replay/**'
      - 'tests/testbed/**'
      - 'tools/cert-validate/validate.py'
      - 'tools/standards/**'
      - 'external/**'
      - 'scripts/init_external_standards.sh'
      - 'scripts/check_cert_write_paths.sh'
      - 'Makefile'
      - '.github/workflows/evidence-v01-smoke.yml'
      - '.github/actions/setup-python-tests/**'
      - '.github/actions/setup-go-cli/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-v01-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-schema-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python tests
        uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.11"
          packages: jsonschema pytest

      - name: Pytest evidence schema
        run: pytest tests/evidence_schema -q

  evidence-validator:
    runs-on: ubuntu-latest
    needs: evidence-schema-only
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go CLI
        uses: ./.github/actions/setup-go-cli
        with:
          go-version-file: core/evidence/go.mod
          build-cli: "false"

      - name: Set up Python tests
        uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.11"
          packages: jsonschema pytest

      - name: Go tests (core/evidence)
        run: go test ./...
        working-directory: core/evidence

      - name: Pytest evidence validation
        run: pytest tests/evidence_validation -q

  smoke:
    runs-on: ubuntu-latest
    needs: evidence-validator
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Go CLI
        uses: ./.github/actions/setup-go-cli
        with:
          go-version-file: core/cli/pf/go.mod
          build-cli: "true"
          binary-name: pf

      - name: Set up Python tests
        uses: ./.github/actions/setup-python-tests
        with:
          python-version: "3.11"
          packages: jsonschema pytest

      - name: Init external standards
        env:
          STANDARDS_GITHUB_TOKEN: ${{ secrets.STANDARDS_GITHUB_TOKEN }}
        run: make submodules

      - name: Install TRACE-REPLAY-KIT Python deps
        run: pip install -r external/TRACE-REPLAY-KIT/runner/requirements.txt

      - name: Standards pin check
        run: make standards-pin-check

      - name: Require CERT-V1 schema
        run: |
          test -f external/CERT-V1/schema/cert-v1.schema.json

      - name: CERT write path guard
        run: bash scripts/check_cert_write_paths.sh

      - name: Go tests (core/evidence)
        run: go test ./...
        working-directory: core/evidence

      - name: Validate fixture bundle (strict)
        run: |
          ./core/cli/pf/pf evidence validate \
            specs/evidence/v0.1/examples/valid/basic-evidence-bundle.json \
            --strict \
            --base-dir specs/evidence/v0.1/examples/valid

      - name: Pytest evidence suites
        run: |
          pytest tests/evidence_schema -q
          pytest tests/evidence_validation -q
          pytest tests/evidence_replay -q
          pytest tests/evidence_trace -q
          pytest tests/e2e/test_evidence_bundle_basic.py -q
          pytest tests/runtime_evidence -q
          pytest tests/forensic_replay -q

      - name: Testbed happy path
        run: bash testbed/evidence-v0.1/run_happy_path.sh

      - name: Testbed tamper case
        run: bash testbed/evidence-v0.1/run_tamper_case.sh

      - name: Testbed v0.2 deep replay (static)
        run: bash testbed/evidence-v0.2/run_deep_replay.sh

      - name: Testbed v0.2 deep replay (execute + low-view)
        run: bash testbed/evidence-v0.2/run_deep_replay.sh --execute

      - name: Pytest deep replay execute
        run: pytest tests/evidence_replay/test_evidence_replay_execute.py -q

      - name: Pytest testbed wrapper
        run: pytest tests/testbed -q

      - name: Runtime sidecar emit (Linux + CERT-V1 required)
        env:
          CI: true
        run: pytest tests/runtime_evidence/test_runtime_evidence_sidecar.py -q
