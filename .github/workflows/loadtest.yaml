name: Load Testing

# CI smoke: local mock + k6 with latency/error assertions (no compose scale-out).
# Full ledger compose load remains dispatch-only (inputs.mode=full).
on:
  push:
    branches: [main, develop]
    paths:
      - "tests/load/**"
      - "tests/perf/mock_load_server.py"
      - ".github/workflows/loadtest.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/load/**"
      - "tests/perf/mock_load_server.py"
      - ".github/workflows/loadtest.yaml"
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (local mock) or full (ledger compose)"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, full]

jobs:
  load-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        shell: bash
        run: |
          set -euo pipefail
          # Bind the signing key to the documented k6 publisher fingerprint.
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$key_dir/key.gpg" https://dl.k6.io/key.gpg
          # Collect primary-key fingerprints only. Subkey fingerprints do not
          # authorize independent package signers; additional primary keys do.
          fingerprints="$(gpg --batch --quiet --show-keys --with-colons "$key_dir/key.gpg" \
            | awk -F: '$1 == "pub" { pending=1; next } pending && $1 == "fpr" { print toupper($10); pending=0 }')"
          expected='C5AD17C747E3415A3642D57D77C6C491D6AC1D69'
          if [ "$fingerprints" != "$expected" ]; then
            echo "::error::Unexpected or additional k6 APT primary signing key" >&2
            exit 1
          fi
          gpg --batch --dearmor --output "$key_dir/k6-archive-keyring.gpg" "$key_dir/key.gpg"
          sudo install -m 0644 "$key_dir/k6-archive-keyring.gpg" \
            /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Start mock ledger endpoint
        run: |
          python3 tests/perf/mock_load_server.py &
          echo $! > /tmp/mock-ledger.pid
          sleep 1
          curl -sf http://127.0.0.1:8080/health

      - name: Run CI-sized load smoke
        run: |
          k6 run --env BASE_URL=http://127.0.0.1:8080 tests/load/ci_smoke.js \
            --summary-export tests/load/results.json
          python3 tests/load/assert_k6_summary.py tests/load/results.json \
            --max-fail-rate 0.01 --max-p95-ms 500 --min-checks-rate 0.99

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-${{ github.run_id }}
          path: tests/load/results.json
          retention-days: 14

      - name: Stop mock
        if: always()
        run: |
          # ci-honesty: justified wave8-local-proofs
          if [ -f /tmp/mock-ledger.pid ]; then kill "$(cat /tmp/mock-ledger.pid)" || true; fi

  load-full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run ledger compose load
        run: |
          cd runtime/ledger
          docker build -t provability-fabric/ledger:test .
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          timeout 120 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done'
      - name: Install k6
        shell: bash
        run: |
          set -euo pipefail
          # Bind the signing key to the documented k6 publisher fingerprint.
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$key_dir/key.gpg" https://dl.k6.io/key.gpg
          # Collect primary-key fingerprints only. Subkey fingerprints do not
          # authorize independent package signers; additional primary keys do.
          fingerprints="$(gpg --batch --quiet --show-keys --with-colons "$key_dir/key.gpg" \
            | awk -F: '$1 == "pub" { pending=1; next } pending && $1 == "fpr" { print toupper($10); pending=0 }')"
          expected='C5AD17C747E3415A3642D57D77C6C491D6AC1D69'
          if [ "$fingerprints" != "$expected" ]; then
            echo "::error::Unexpected or additional k6 APT primary signing key" >&2
            exit 1
          fi
          gpg --batch --dearmor --output "$key_dir/k6-archive-keyring.gpg" "$key_dir/key.gpg"
          sudo install -m 0644 "$key_dir/k6-archive-keyring.gpg" \
            /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version
      - name: Run ledger_load.js
        run: k6 run --env LEDGER_URL=http://localhost:4000 tests/load/ledger_load.js
      - name: Cleanup
        if: always()
        run: |
          cd runtime/ledger
          # ci-honesty: justified wave8-local-proofs — teardown must not mask test result
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true
