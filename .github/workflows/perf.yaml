name: Performance Tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build sidecar watcher
        run: |
          cd runtime/sidecar-watcher
          cargo build --release

      - name: Run performance benchmark
        run: |
          python scripts/bench.py --count 100000 --output perf-results.json

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ github.run_number }}
          path: perf-results.json

      # Global `gh-pages` CLI fails on GHA with:
      # TypeError: The "path" argument must be of type string. Received undefined
      # (find-cache-dir returns undefined under global npm install). Use the
      # in-repo peaceiris action instead (same pattern as compliance.yaml).
      - name: Prepare perf publish directory
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p perf
          cp perf-results.json "perf/$(date +%Y-%m-%d).json"

      - name: Deploy to gh-pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./perf
          keep_files: true
