name: Red-Team Attack Simulation

on:
  schedule:
    # Run weekly on Sundays at 1 AM UTC
    - cron: "0 1 * * 0"
  pull_request:
    paths:
      - "runtime/**"
      - "tests/redteam/**"
      - "tests/test_redteam_observation_gate.py"
      - "tests/test_redteam_egress_contract.py"
      - "tests/test_redteam_retrieval_contract.py"
      - "tests/test_redteam_retrieval_client.py"
      - "tests/redteam/requirements.txt"
      - ".github/workflows/redteam.yaml"
  workflow_dispatch:

jobs:
  redteam-observation-contract:
    name: Red-team observation accounting unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compile security harness scripts
        run: python3 -m py_compile tests/redteam/abac_fuzz.py tests/redteam/pii_leak.py
      - name: Exercise incomplete and failed execution negative controls
        run: python3 -m unittest discover -s tests -p 'test_redteam_observation_gate.py' -v
      - name: Verify explicit offline-mode classification
        run: python3 tests/redteam/abac_fuzz.py --offline --queries 12
      - name: Install PII harness dependency
        run: python3 -m pip install -r tests/redteam/requirements.txt
      - name: Exercise egress API and vector-count negative controls
        run: python3 -m unittest discover -s tests -p 'test_redteam_egress_contract.py' -v
      - name: Exercise retrieval reference-corpus and client negative controls
        run: python3 -m unittest discover -s tests -p 'test_redteam_retrieval_*.py' -v

  redteam-offline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml requests
      - name: Run offline red-team scripts
        run: |
          # Job is offline-only: no kernel/gateway is started. Without --offline,
          # connection failures look like universal BLOCKED and false-fail ALLOWED cases.
          python tests/redteam/injection_runner.py \
            --corpus tests/redteam/injection_corpus.jsonl \
            --offline \
            --output injection-results.json
          python tests/redteam/abac_fuzz.py --offline
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: redteam-offline-${{ github.run_id }}
          path: injection-results.json

  redteam-attack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Kind cluster
        run: |
          # Install Kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          # Create Kind cluster
          kind create cluster --name redteam-test --config - <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 30000
              hostPort: 30000
          - role: worker
          - role: worker
          EOF

          # Wait for cluster to be ready
          kubectl wait --for=condition=Ready node --all --timeout=300s

      - name: Build and load images
        run: |
          # Build admission controller
          docker build -t provability-fabric/admission-controller:test runtime/admission-controller
          kind load docker-image provability-fabric/admission-controller:test --name redteam-test

          # Build sidecar watcher (repo-root context for pf-dsse path dep)
          docker build -f runtime/sidecar-watcher/Dockerfile -t provability-fabric/sidecar-watcher:test .
          kind load docker-image provability-fabric/sidecar-watcher:test --name redteam-test

      - name: Deploy admission controller
        run: |
          cd runtime/admission-controller
          helm install admission ./deploy/admission \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --set leancheck.url=http://localhost:8080 \
            --set enablePolicy=true \
            --set ledger.url=http://ledger:4000/graphql

      - name: Start ledger service
        run: |
          cd runtime/ledger
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

          # Wait for ledger to be ready
          timeout 180 bash -c 'until curl -f http://localhost:4000/health; do sleep 2; done'

      - name: Install dependencies
        run: |
          pip install kubernetes requests pyyaml

      - name: Run red-team attacks
        run: |
          # Get kubeconfig
          kind get kubeconfig --name redteam-test > /tmp/kubeconfig

          # Run red-team harness
          python tests/redteam/redteam_runner.py \
            --kube-config /tmp/kubeconfig \
            --ledger-url http://localhost:4000 \
            --output redteam-results.md

      - name: Upload red-team results
        uses: actions/upload-artifact@v7
        with:
          name: redteam-results-${{ github.run_id }}
          path: redteam-results.md

      - name: Check attack results
        run: |
          if [ -f "redteam-results.md" ]; then
            echo "📊 Red-team attack results:"
            cat redteam-results.md
            
            # Check if any attacks failed
            if grep -q "❌ FAIL" redteam-results.md; then
              echo "❌ Some red-team attacks were not caught by guards!"
              exit 1
            else
              echo "✅ All red-team attacks were properly caught by guards!"
            fi
          else
            echo "❌ No red-team results file found"
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = 'Red-team attack simulation completed.';

            try {
              if (fs.existsSync('redteam-results.md')) {
                report = fs.readFileSync('redteam-results.md', 'utf8');
              }
            } catch (error) {
              console.log('Could not read red-team results:', error.message);
            }

            const body = `## Red-Team Attack Simulation

            ${report}

            _Generated by Provability-Fabric red-team harness_`;

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (error) {
              core.warning(`Could not post PR comment: ${error.message}`);
            }

      - name: Cleanup
        if: always()
        run: |
          # Clean up Kind cluster
          kind delete cluster --name redteam-test

          # Clean up ledger service
          cd runtime/ledger
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
