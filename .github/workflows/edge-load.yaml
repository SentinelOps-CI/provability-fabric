name: Edge API Load Testing

# CI smoke: local mock edge endpoints + tiny k6. Full multi-region SaaS load
# remains workflow_dispatch-only via inputs.mode=full (still requires live APIs).
on:
  push:
    branches: [main, develop]
    paths:
      - "tests/load/**"
      - "tests/perf/mock_load_server.py"
      - ".github/workflows/edge-load.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/load/**"
      - "tests/perf/mock_load_server.py"
      - ".github/workflows/edge-load.yaml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (local mock) or full (live edge APIs)"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, full]

env:
  K6_VERSION: "0.47.0"

jobs:
  edge-load-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -L "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo cp "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/
          k6 version

      - name: Start mock edge API
        run: |
          python3 tests/perf/mock_load_server.py &
          echo $! > /tmp/mock-edge.pid
          sleep 1
          curl -sf http://127.0.0.1:8080/health

      - name: Run CI-sized edge load smoke
        run: |
          k6 run --env BASE_URL=http://127.0.0.1:8080 tests/load/ci_smoke.js \
            --summary-export edge-smoke-summary.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-load-smoke-results
          path: edge-smoke-summary.json
          retention-days: 14

      - name: Stop mock
        if: always()
        run: |
          # ci-honesty: justified wave8-remediation
          if [ -f /tmp/mock-edge.pid ]; then kill "$(cat /tmp/mock-edge.pid)" || true; fi

  edge-load-full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl -L "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo cp "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/
      - name: Run full edge load (live endpoints)
        run: |
          k6 run --out json=load-test-results.json tests/load/edge_load.js
