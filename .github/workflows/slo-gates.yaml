name: SLO Gates

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/perf/**"
      - ".github/workflows/slo-gates.yaml"
  push:
    branches: [main]
    paths:
      - "tests/perf/**"
      - ".github/workflows/slo-gates.yaml"
  schedule:
    # Nightly performance test
    - cron: '0 2 * * *'

env:
  BASE_URL: http://localhost:8080
  K6_BINARY: k6
  NODE_VERSION: '18'

jobs:
  # PR Smoke Test - Quick performance validation
  pr-smoke-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install k6
      run: |
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6
        
    - name: Start services
      run: |
        python3 tests/perf/mock_pf_server.py &
        echo $! > /tmp/mock-pf.pid
        sleep 2
        
    - name: Run SLO smoke test
      run: |
        k6 run tests/perf/latency_k6.js \
          --env BASE_URL=http://127.0.0.1:8080 \
          --stage 10s:5 \
          --stage 20s:10 \
          --stage 10s:0
          
    - name: Run component budget test
      if: hashFiles('package.json') != ''
      run: |
        npm run test:component-budgets || echo "component-budgets skipped (no root package.json suite)"
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pr-smoke-results
        path: |
          k6-results.json
          component-budget-results.json
          
  # Nightly k6 latency gate (mock PF server; no root package.json required)
  nightly-k6-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install k6
      run: |
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6

    - name: Start mock PF server
      run: |
        python3 tests/perf/mock_pf_server.py &
        sleep 2

    - name: Run nightly k6 latency gate
      run: |
        k6 run tests/perf/latency_k6.js \
          --env BASE_URL=http://127.0.0.1:8080 \
          --stage 30s:20 \
          --stage 2m:50 \
          --stage 30s:0 \
          --threshold 'p(95)<2000' \
          --threshold 'errors<0.01'

    - name: Upload k6 results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nightly-k6-results
        path: k6-results.json
        if-no-files-found: ignore
