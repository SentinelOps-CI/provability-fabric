name: Performance Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "bench/**"
      - ".github/workflows/performance-gate.yaml"
  push:
    branches: [main, develop]
    paths:
      - "bench/**"
      - ".github/workflows/performance-gate.yaml"
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: "Baseline commit for comparison"
        required: false
        default: "HEAD~1"

jobs:
  performance-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: [stable]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for baseline comparison

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}
          profile: minimal

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev bc

      - name: Run Criterion smoke benchmarks
        run: |
          cd bench
          cargo bench -p provability-fabric-bench -- --sample-size 10 --noplot
          echo "performance_gate=passed" >> "$GITHUB_OUTPUT"
        id: gates

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.rust-version }}
          path: bench/target/criterion/**

  performance-summary:
    runs-on: ubuntu-latest
    needs: performance-benchmark
    if: always()
    
    steps:
      - name: Set conclusion
        run: |
          if [ "${{ needs.performance-benchmark.result }}" = "success" ]; then
            echo "Performance gate completed successfully"
          else
            echo "Performance gate failed"
            exit 1
          fi
