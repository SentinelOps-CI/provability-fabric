name: CERT-V1 Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "evidence/**"
      - "tests/replay/**"
      - "external/**"
      - "tools/cert-validate/**"
      - "Makefile"
      - ".github/workflows/cert-validate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "evidence/**"
      - "tests/replay/**"
      - "external/**"
      - "tools/cert-validate/**"
      - "Makefile"
      - ".github/workflows/cert-validate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cert-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-certs:
    name: Validate CERT-V1 JSON Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Init external standards
        env:
          STANDARDS_GITHUB_TOKEN: ${{ secrets.STANDARDS_GITHUB_TOKEN }}
        run: make submodules

      - name: Require CERT-V1 schema
        shell: bash
        run: |
          set -euo pipefail
          schema="external/CERT-V1/schema/cert-v1.schema.json"
          if [ ! -f "$schema" ]; then
            echo "CERT-V1 schema missing at $schema"
            echo "Clone per external/README.md (make submodules)."
            exit 1
          fi

      - name: Install validation dependencies
        run: |
          cd tools/cert-validate
          pip install -r requirements.txt

      - name: Validate CERT files (fail-closed)
        run: make validate-certs

      - name: Upload validation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cert-validation-failures
          path: |
            evidence/**/*.cert.json
            tests/replay/out/**/*.cert.json
          retention-days: 7

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'CERT-V1 validation failed. Check workflow logs and ensure JSON files conform to the schema at external/CERT-V1/schema/cert-v1.schema.json.',
            });
