name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Go builds
        run: |
          for d in services/*; do
            if [ -f "$d/go.mod" ]; then
              (cd "$d" && go mod tidy && go build ./...)
            fi
          done

      - name: Verify Rust workspace builds
        run: |
          cargo build -q

      - name: Verify Node builds (console + demos)
        run: |
          (cd console && npm ci --no-audit --no-fund && npm run build)
          (cd demos/verifiable-mcp-fraud && npm ci --no-audit --no-fund && npm run build)

      - name: Buf lint
        uses: bufbuild/buf-setup-action@v1
      - run: buf lint
        working-directory: api
