# Single CI entry: protobuf lint always; full matrix runs on push to main or when non-doc paths change.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!figs/**'

  protobuf-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
        working-directory: api

  prepare:
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/reusable-ci-prepare.yml
    secrets: inherit

  ci-lean:
    needs: [prepare]
    uses: ./.github/workflows/reusable-ci-lean.yml
    with:
      impacted_targets: ${{ needs.prepare.outputs.impacted_targets }}
      impacted_tests: ${{ needs.prepare.outputs.impacted_tests }}
      allowlist_needs_update: ${{ needs.prepare.outputs.allowlist_needs_update }}
    secrets: inherit

  ci-rust:
    needs: [prepare]
    uses: ./.github/workflows/reusable-ci-rust.yml
    secrets: inherit

  ci-go-node:
    needs: [prepare]
    uses: ./.github/workflows/reusable-ci-go-node.yml
    secrets: inherit

  ci-extended:
    needs: [prepare]
    uses: ./.github/workflows/reusable-ci-extended.yml
    with:
      impacted_tests: ${{ needs.prepare.outputs.impacted_tests }}
    secrets: inherit

  ci-success:
    name: CI required checks
    needs:
      - changes
      - protobuf-lint
      - prepare
      - ci-lean
      - ci-rust
      - ci-go-node
      - ci-extended
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify outcomes
        run: |
          set -e
          if [ "${{ needs.protobuf-lint.result }}" != "success" ]; then
            echo "protobuf-lint did not succeed: ${{ needs.protobuf-lint.result }}"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.code }}" != "true" ]; then
            echo "Documentation-only PR: full CI skipped intentionally."
            exit 0
          fi
          fail=0
          for j in prepare ci-lean ci-rust ci-go-node ci-extended; do
            case "$j" in
              prepare) r="${{ needs.prepare.result }}" ;;
              ci-lean) r="${{ needs.ci-lean.result }}" ;;
              ci-rust) r="${{ needs.ci-rust.result }}" ;;
              ci-go-node) r="${{ needs.ci-go-node.result }}" ;;
              ci-extended) r="${{ needs.ci-extended.result }}" ;;
            esac
            if [ "$r" != "success" ]; then
              echo "Job $j result: $r (expected success)"
              fail=1
            fi
          done
          exit "$fail"
