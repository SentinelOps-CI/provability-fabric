# SPDX-License-Identifier: Apache-2.0
# Temporary native resolver; delete after committing both generated lockfiles.
name: Ledger MCP and parser resolution candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/ledger/package.json'
      - 'runtime/ledger/package-lock.json'
      - 'package-lock.json'
      - '.github/workflows/ledger-mcp-parser-resolution-candidate.yml'

permissions:
  contents: read

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve workspace and isolated Ledger lockfiles
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --workspace runtime/ledger
          isolated="$(mktemp -d)"
          git archive HEAD runtime/ledger | tar -x -C "$isolated"
          (
            cd "$isolated/runtime/ledger"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          )
          cp "$isolated/runtime/ledger/package-lock.json" runtime/ledger/package-lock.json
          printf 'LEDGER_ISOLATED=%s\n' "$isolated/runtime/ledger" >> "$GITHUB_ENV"
          git diff --exit-code -- package.json runtime/ledger/package.json core/sdk/typescript/package.json core/sdk/typescript/package-lock.json
          git diff --check -- package-lock.json runtime/ledger/package-lock.json
          git diff --no-ext-diff -- package-lock.json runtime/ledger/package-lock.json
          cp package-lock.json /tmp/pf-root-resolved.json
          cp runtime/ledger/package-lock.json /tmp/pf-ledger-resolved.json
      - name: Preserve native lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: ledger-mcp-parser-native-lockfiles
          path: |
            package-lock.json
            runtime/ledger/package-lock.json
          if-no-files-found: error
      - name: Verify parity and retain security floors
        run: |
          set -euo pipefail
          node --test tests/test_npm_lockfile_parity.mjs
          node scripts/check_npm_lockfile_parity.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path

          def version(value):
              parts = value.split(".")
              assert len(parts) == 3 and all(x.isdigit() for x in parts), value
              return tuple(map(int, parts))

          floors = {
              "axios": {1: (1, 20, 0)},
              "compression": {1: (1, 8, 2)},
              "form-data": {4: (4, 0, 6)},
              "hasown": {2: (2, 0, 4)},
              "brace-expansion": {1: (1, 1, 22), 5: (5, 1, 0)},
              "js-yaml": {3: (3, 15, 2), 4: (4, 3, 2)},
              "handlebars": {4: (4, 7, 10)},
              "proxy-addr": {2: (2, 0, 8)},
              "follow-redirects": {1: (1, 16, 3)},
              "@modelcontextprotocol/sdk": {1: (1, 32, 1)},
              "body-parser": {1: (1, 20, 9), 2: (2, 4, 0)},
          }
          for path in ("package-lock.json", "runtime/ledger/package-lock.json"):
              packages = json.loads(Path(path).read_text())["packages"]
              for key, entry in packages.items():
                  for name, minimums in floors.items():
                      if key == f"node_modules/{name}" or key.endswith(f"/node_modules/{name}"):
                          actual = version(entry["version"])
                          if actual[0] in minimums:
                              assert actual >= minimums[actual[0]], (path, key, actual, minimums[actual[0]])
              prefix = "runtime/ledger/" if path == "package-lock.json" else ""
              for name, expected in [("@modelcontextprotocol/sdk", "1.32.1"), ("body-parser", "1.20.9")]:
                  entry = packages.get(f"{prefix}node_modules/{name}") or packages.get(f"node_modules/{name}")
                  assert entry and entry["version"] == expected, (path, name, entry)
          PY
      - name: Workspace locked installation and tests
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run prisma:generate -w provability-fabric-ledger
          npm run typecheck:server -w provability-fabric-ledger
          npm test -w provability-fabric-ledger -- --runInBand
          npm test -w @provability-fabric/core-sdk-typescript -- --runInBand
      - name: Standalone locked installation and tests
        run: |
          set -euo pipefail
          cd "$LEDGER_ISOLATED"
          npm ci --no-audit --no-fund
          npm run prisma:generate
          npm run typecheck:server
          npm test -- --runInBand
      - name: Confirm resolution remains immutable
        run: |
          set -euo pipefail
          cmp package-lock.json /tmp/pf-root-resolved.json
          cmp runtime/ledger/package-lock.json /tmp/pf-ledger-resolved.json
          cmp "$LEDGER_ISOLATED/package-lock.json" /tmp/pf-ledger-resolved.json
          git diff --exit-code -- package.json runtime/ledger/package.json core/sdk/typescript/package.json core/sdk/typescript/package-lock.json
