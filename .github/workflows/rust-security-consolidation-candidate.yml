# SPDX-License-Identifier: Apache-2.0
# Temporary native resolver for the draft combined security candidate.
# Remove this workflow after committing the generated Cargo.lock.
name: Rust security consolidation candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-security-consolidation-candidate.yml'
      - 'Cargo.lock'
      - 'adapters/**'
      - 'runtime/egress-firewall/**'

permissions:
  contents: read

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Install native seccomp headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev pkg-config
      - name: Resolve the two previously qualified changes
        run: |
          set -euo pipefail
          cargo update -p libseccomp --precise 0.4.0
          cargo metadata --locked --features httpget-adapter/seccomp,fileread-adapter/seccomp --format-version 1 > /tmp/pf-combined-metadata.json
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          versions = {}
          for p in lock["package"]:
              versions.setdefault(p["name"], set()).add(p["version"])
          for name, version in [
              ("libseccomp", "0.4.0"), ("libseccomp-sys", "0.3.0"),
              ("wasmtime", "36.0.22"), ("sqlx", "0.8.6"),
              ("tokio", "1.53.3"), ("openssl", "0.10.80"),
              ("actix-web", "4.20.0"), ("actix-http", "3.22.0"),
              ("url", "2.5.9"), ("anyhow", "1.0.103"),
              ("time", "0.3.47"),
          ]:
              assert versions.get(name) == {version}, (name, versions.get(name))
          assert "humantime" not in versions
          assert "0.17.0" not in versions.get("nix", set())
          assert versions.get("cookie") == {"0.18.3"}
          for name in ("wasmtime-wasi", "wasi-common", "wiggle", "wasi-cap-std-sync"):
              assert name not in versions, name
          data = json.loads(Path("/tmp/pf-combined-metadata.json").read_text())
          ids = {p["id"] for p in data["packages"] if p["name"] == "actix-web"}
          nodes = [n for n in data["resolve"]["nodes"] if n["id"] in ids]
          assert len(nodes) == 1
          features = set(nodes[0]["features"])
          assert not features.intersection({"cookies", "secure-cookies", "default"})
          assert {"macros", "compress-brotli", "compress-gzip", "compress-zstd", "http2"} <= features
          PY
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock
          cp Cargo.lock /tmp/pf-resolved.lock
      - name: Preserve exact native lockfile
        uses: actions/upload-artifact@v4
        with:
          name: combined-rust-seccomp-cookie-Cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Test resolved adapters
        run: |
          set -euo pipefail
          cargo test --locked -p fileread-adapter -p httpget-adapter
          cargo test --locked -p fileread-adapter --features seccomp --bin fileread-adapter
          cargo test --locked -p httpget-adapter --features seccomp --bin httpget-adapter
          cargo build --locked -p fileread-adapter --features seccomp
          cargo build --locked -p httpget-adapter --features seccomp
          python3 tests/test_adapter_seccomp_cli.py
      - name: Test resolved firewall
        run: |
          set -euo pipefail
          cargo test --locked -p egress-firewall --no-default-features
          cargo test --locked -p egress-firewall
          cargo build --locked -p egress-firewall
          cmp /tmp/pf-resolved.lock Cargo.lock
