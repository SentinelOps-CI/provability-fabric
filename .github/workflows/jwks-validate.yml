name: JWKS Validate CERTs

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'evidence/**'
      - '.github/workflows/jwks-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build CLI (so)
        run: |
          set -euo pipefail
          cd core/cli/pf
          go build -o so .
          echo "$PWD" >> $GITHUB_PATH
      - name: Run jwks validation
        env:
          JWKS_URL: ${{ secrets.TEST_JWKS_URL }}
        run: |
          set -euo pipefail
          cd core/cli/pf
          if [ -z "${JWKS_URL:-}" ]; then
            echo "TEST_JWKS_URL secret unset; JWKS validation skipped (not soft-passed)."
            exit 0
          fi
          # Fail closed when TEST_JWKS_URL is configured.
          ./so cert verify ../../evidence/certs --json --jwks "$JWKS_URL"
