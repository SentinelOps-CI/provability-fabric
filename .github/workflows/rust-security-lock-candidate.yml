# SPDX-License-Identifier: Apache-2.0
# Temporary resolver for the targeted security remediation branch.
name: Rust security lock candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'security/rust-tokio-openssl-lock-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.98.1"
      - name: Resolve targeted security updates
        run: |
          set -euo pipefail
          cargo update -p tokio --precise 1.53.3
          cargo update -p openssl --precise 0.10.80
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- . ':!Cargo.lock'
          git diff --check -- Cargo.lock
          git diff -- Cargo.lock
      - name: Verify locked dependency resolution
        run: |
          set -euo pipefail
          cargo tree --locked -i tokio@1.53.3
          cargo tree --locked -i openssl@0.10.80
      - name: Preserve resolver-produced lockfile
        uses: actions/upload-artifact@v4
        with:
          name: rust-security-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
