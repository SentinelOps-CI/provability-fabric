name: Documentation Build

on:
  push:
    branches: [main]
    paths:
      - "bundles/**/spec.yaml"
      - "docs/**"
      - "mkdocs.yml"
      - ".markdown-link-check.json"
      - "cmd/specdoc/**"
  pull_request:
    branches: [main]
    paths:
      - "bundles/**/spec.yaml"
      - "docs/**"
      - "mkdocs.yml"
      - ".markdown-link-check.json"
      - "cmd/specdoc/**"
      - ".github/workflows/docs-build.yaml"
  workflow_dispatch:

jobs:
  documentation-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install -g markdownlint-cli
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Generate documentation
        run: |
          # Build specdoc tool
          cd cmd/specdoc
          unformatted=$(gofmt -l *.go)
          test -z "$unformatted" || { printf 'Unformatted specdoc files:\n%s\n' "$unformatted" >&2; exit 1; }
          go test ./...
          go build -o specdoc .
          cd ../..

          # Create docs/generated directory
          mkdir -p docs/generated

          # Generate docs for all spec.yaml files
          # Stable, collision-resistant names preserve distinct specification paths.
          while IFS= read -r -d '' spec; do
            relative="${spec#bundles/}"
            relative="${relative%/spec.yaml}"
            slug="${relative//\//__}"
            cmd/specdoc/specdoc generate "$spec" --out "docs/generated/${slug}.md"
          done < <(find bundles -type f -name spec.yaml -print0 | sort -z)

      - name: Lint generated documentation
        run: |
          if compgen -G "docs/generated/*.md" > /dev/null; then
            markdownlint docs/generated/*.md
          else
            echo "No docs/generated/*.md to lint"
          fi

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Check for broken links
        run: |
          npm install -g markdown-link-check@3.11.2
          find docs -name "*.md" -exec markdown-link-check -c .markdown-link-check.json -q {} \;
