#
# Shared Node setup for package islands (ledger, SDK, demos, dsse-ts, …).
# Prefer this over copy-pasted setup-node + npm ci blocks.

name: Setup Node workspace
description: Install Node.js with npm cache and install dependencies in one package directory.

inputs:
  node-version:
    description: Node.js major/minor version
    required: false
    default: "20"
  working-directory:
    description: Package directory containing package.json / package-lock.json
    required: true
  install-command:
    description: Install command (npm ci preferred when lockfile is present)
    required: false
    default: "npm ci --no-fund --no-audit"
  cache:
    description: setup-node cache backend (npm | yarn | pnpm | none)
    required: false
    default: "npm"

runs:
  using: composite
  steps:
    - name: Detect package-lock.json
      id: lockfile
      shell: bash
      run: |
        set -euo pipefail
        lock="${{ inputs.working-directory }}/package-lock.json"
        if [ -f "$lock" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "No package-lock.json at $lock; Node cache disabled for this install."
        fi

    - name: Set up Node.js (cached)
      if: inputs.cache != 'none' && inputs.cache != '' && steps.lockfile.outputs.present == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Set up Node.js (no cache)
      if: inputs.cache == 'none' || inputs.cache == '' || steps.lockfile.outputs.present != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Node dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [ -f package-lock.json ]; then
          ${{ inputs.install-command }}
        else
          npm install --no-fund --no-audit
        fi
