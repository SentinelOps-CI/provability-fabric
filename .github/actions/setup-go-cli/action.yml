#
# Shared Go toolchain setup for CLI / module jobs.
# Prefer go-version-file so the module pin stays authoritative.

name: Setup Go CLI
description: Install Go (module-pinned), optionally build the pf CLI and add it to PATH.

inputs:
  go-version-file:
    description: Path to go.mod used for the toolchain version
    required: false
    default: "core/cli/pf/go.mod"
  go-version:
    description: Explicit Go version (used only when go-version-file is empty)
    required: false
    default: ""
  cache:
    description: Enable setup-go module cache
    required: false
    default: "true"
  build-cli:
    description: Build core/cli/pf and prepend it to PATH
    required: false
    default: "false"
  cli-directory:
    description: Directory containing the pf main package
    required: false
    default: "core/cli/pf"
  binary-name:
    description: Output binary name
    required: false
    default: "pf"

runs:
  using: composite
  steps:
    - name: Set up Go (version file)
      if: inputs.go-version-file != ''
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache == 'true' }}

    - name: Set up Go (explicit version)
      if: inputs.go-version-file == ''
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version != '' && inputs.go-version || '1.23' }}
        cache: ${{ inputs.cache == 'true' }}

    - name: Build pf CLI
      if: inputs.build-cli == 'true'
      shell: bash
      working-directory: ${{ inputs.cli-directory }}
      run: |
        set -euo pipefail
        go build -o "${{ inputs.binary-name }}" .
        echo "$PWD" >> "$GITHUB_PATH"
        echo "Built ${{ inputs.binary-name }} in $PWD"
