[package]
name = "provability-fabric-core-sdk-rust"
version = "1.0.0"
edition = "2021"
authors = ["Provability Fabric Team"]
description = "Provability Fabric Core SDK for Rust"
license = "Apache-2.0"
repository = "https://github.com/provability-fabric/provability-fabric"
keywords = [
    "provability-fabric",
    "ai-safety",
    "policy-enforcement",
    "grpc",
    "rust",
]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
tonic = { version = "=0.12.3", features = ["gzip"] }
prost = "=0.13.5"
prost-types = "=0.13.5"
sha2 = "0.10"
hex = "0.4"
regex = "1"
lazy_static = "1"
rand = "0.8"
base64 = "0.21"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "=0.3.47", features = ["parsing"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-build = "=0.12.3"

[dev-dependencies]
tokio-test = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
criterion = "0.5"


[features]
default = ["full"]
full = ["tonic/transport"]
minimal = []
