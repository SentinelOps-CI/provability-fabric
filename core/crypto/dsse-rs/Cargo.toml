[package]
name = "pf-dsse"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-language DSSE verification for Provability Fabric"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.0", features = ["pkcs8"] }
pem = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "dsse-verify"
path = "src/bin/dsse_verify.rs"
