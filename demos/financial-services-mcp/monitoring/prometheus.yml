global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Financial MCP Server metrics
  - job_name: 'financial-mcp-server'
    static_configs:
      - targets: ['financial-mcp-server:8080']
    scrape_interval: 5s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Fraud Detection Agent metrics  
  - job_name: 'fraud-detection-agent'
    static_configs:
      - targets: ['fraud-detection-agent:8082']
    scrape_interval: 5s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Audit Trail Service metrics
  - job_name: 'audit-trail-service'
    static_configs:
      - targets: ['audit-verifier:8083']
    scrape_interval: 5s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # Transaction Simulator metrics
  - job_name: 'transaction-simulator'
    static_configs:
      - targets: ['transaction-simulator:8081']
    scrape_interval: 5s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # PostgreSQL metrics (if pg_stat_statements enabled)
  - job_name: 'postgres-fintech'
    static_configs:
      - targets: ['postgres-fintech:5432']
    scrape_interval: 30s

  # Redis metrics
  - job_name: 'redis-cache'
    static_configs:
      - targets: ['redis-cache:6379']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
