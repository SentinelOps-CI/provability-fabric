# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run: cargo install cargo-deny && cargo deny check
# CI: .github/workflows/cargo-deny.yml (passes --all-features; matches a full workspace check)

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]

[[advisories.ignore]]
id = "RUSTSEC-2021-0127"
reason = "serde_cbor is used by sidecar-watcher; migration tracked separately"

[licenses]
version = 2
confidence-threshold = 0.85
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "NCSA",
    "LGPL-3.0",
]

# Mozilla/CCADB certificate data, not a general code-license allowance.
# https://cdla.dev/permissive-2-0/ (section 2.1)
# The retrieval image distributes each resolved package's original LICENSE.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=0.26.11"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.12"
allow = ["CDLA-Permissive-2.0"]

# Full self-signed Mozilla/CCADB certificate data used by the patched
# Kubernetes transport (rustls-platform-verifier). The sidecar image
# includes the resolved upstream LICENSE; no general license is added.
[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.12"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Sparse + git deps vary by Cargo version; warn first, tighten after inventory.
unknown-registry = "warn"
unknown-git = "warn"
