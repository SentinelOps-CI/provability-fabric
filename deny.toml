# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run: cargo install cargo-deny && cargo deny check
# CI: .github/workflows/cargo-deny.yml (passes --all-features; matches a full workspace check)

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is a transitive dependency; upgrade tracked separately" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is a transitive dependency via kube" },
    { id = "RUSTSEC-2020-0168", reason = "mach is a transitive dependency via wasmtime" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive proc-macro dependency" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is a transitive dependency" },
    { id = "RUSTSEC-2021-0127", reason = "serde_cbor is used by sidecar-watcher; migration tracked separately" },
    { id = "RUSTSEC-2024-0445", reason = "cap-primitives via wasmtime 15.x sandbox stack" },
    { id = "RUSTSEC-2021-0119", reason = "nix is a transitive dependency via wasmtime-wasi" },
    { id = "RUSTSEC-2026-0098", reason = "rustls/webpki via reqwest/kube transitive chain" },
    { id = "RUSTSEC-2026-0099", reason = "rustls/webpki via reqwest/kube transitive chain" },
    { id = "RUSTSEC-2026-0104", reason = "rustls/webpki via reqwest/kube transitive chain" },
]

[[advisories.ignore]]
crate = "wasmtime"
reason = "wasm-sandbox pinned to wasmtime 15.x pending upgrade (#118)"

[[advisories.ignore]]
crate = "wasmtime-wasi"
reason = "wasm-sandbox pinned to wasmtime-wasi 15.x pending upgrade (#118)"

[[advisories.ignore]]
crate = "wasi-common"
reason = "wasm-sandbox pinned to wasmtime 15.x pending upgrade (#118)"

[[advisories.ignore]]
crate = "wiggle"
reason = "wasm-sandbox pinned to wasmtime 15.x pending upgrade (#118)"

[[advisories.ignore]]
crate = "wasi-cap-std-sync"
reason = "wasm-sandbox pinned to wasmtime 15.x pending upgrade (#118)"

[licenses]
version = 2
confidence-threshold = 0.85
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "OpenSSL",
    "NCSA",
    "LGPL-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Sparse + git deps vary by Cargo version; warn first, tighten after inventory.
unknown-registry = "warn"
unknown-git = "warn"
