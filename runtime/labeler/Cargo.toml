[package]
name = "labeler"
version = "0.1.0"
edition = "2021"
description = "Proof-carrying labeler for JSON path and taint rules"
license = "Apache-2.0"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"

[dev-dependencies]
rand = "0.8"
