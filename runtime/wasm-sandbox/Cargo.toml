[package]
name = "wasm-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["Provability-Fabric Contributors"]
license = "Apache-2.0"

[dependencies]
wasmtime = { version = "=36.0.22", default-features = false, features = ["cranelift", "runtime", "std"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
wasmtime = { version = "=36.0.22", default-features = false, features = ["wat"] }
