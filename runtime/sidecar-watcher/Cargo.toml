[package]
name = "sidecar-watcher"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "SentinelOps Platform Runtime Sidecar"

[dependencies]
anyhow = "1.0"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
humantime = "2"
tracing-subscriber = "0.3"
prometheus-client = "0.22"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
md5 = "0.7"
axum = "0.7"
jsonschema = "0.17"
once_cell = "1.19"
metrics = "0.21"
thiserror = "1.0"
k8s-openapi = { version = "0.20", features = ["v1_28"] }
kube = { version = "0.87", features = ["client", "config"] }

[dev-dependencies]
tokio-test = "0.4"