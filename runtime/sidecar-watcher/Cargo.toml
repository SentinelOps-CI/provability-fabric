[package]
name = "sidecar-watcher"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "SentinelOps Platform Runtime Sidecar"
autotests = false

[dependencies]
pf-dsse = { path = "../../core/crypto/dsse-rs" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
time = { version = "0.3", features = ["formatting"] }
tracing-subscriber = "0.3"
prometheus-client = "0.22"
reqwest = { version = "=0.12.28", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
axum = { version = "=0.7.9", features = ["http2"] }
# Keep local reference support; schema validation must not fetch HTTP resources.
jsonschema = { version = "=0.17.1", default-features = false, features = ["resolve-file", "cli"] }
once_cell = "1.19"
metrics = "0.21"
thiserror = "1.0"
# Candidate minimum upstream-tested cluster version: Kubernetes 1.32.
# Explicit Rustls provider; keep OpenSSL TLS disabled for Kubernetes.
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["v1_32"] }
kube = { version = "=4.2.1", default-features = false, features = ["client", "config", "rustls-tls", "ring"] }
# Performance optimization dependencies
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"
serde_cbor = "0.11"
rand = "0.8"
arc-swap = "1.6"
parking_lot = "0.12"

[[bin]]
name = "emit_observation"
path = "src/bin/emit_observation.rs"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1.4"

[[test]]
name = "declassify_engine"
path = "tests/declassify_engine.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "break_glass_mechanism"
path = "tests/break_glass_mechanism.rs"

[[test]]
name = "dfa_equiv"
path = "tests/dfa_equiv.rs"

[[test]]
name = "emit_evidence_tests"
path = "tests/emit_evidence_tests.rs"

[[test]]
name = "ni_monitor_egress"
path = "tests/ni_monitor_egress.rs"

[[test]]
name = "safety_case_bundle"
path = "tests/safety_case_bundle.rs"

[[test]]
name = "events_plan_dsl"
path = "tests/events_plan_dsl.rs"

[[test]]
name = "hardened_adapters"
path = "tests/hardened_adapters.rs"

[[test]]
name = "egress_evidence_enforcement"
path = "tests/egress_evidence_enforcement.rs"

[[test]]
name = "runtime_observation_tests"
path = "tests/runtime_observation_tests.rs"
