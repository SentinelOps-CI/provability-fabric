[package]
name = "sidecar-watcher"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "SentinelOps Platform Runtime Sidecar"
autotests = false

[dependencies]
pf-dsse = { path = "../../core/crypto/dsse-rs" }
anyhow = "1.0"
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
humantime = "2"
tracing-subscriber = "0.3"
prometheus-client = "0.22"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
axum = "0.7"
jsonschema = "0.17"
once_cell = "1.19"
metrics = "0.21"
thiserror = "1.0"
k8s-openapi = { version = "0.20", features = ["v1_28"] }
kube = { version = "0.87", features = ["client", "config"] }
# Performance optimization dependencies
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"
serde_cbor = "0.11"
rand = "0.8"
arc-swap = "1.6"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1.4"

[[test]]
name = "declassify_engine"
path = "tests/declassify_engine.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "break_glass_mechanism"
path = "tests/break_glass_mechanism.rs"

[[test]]
name = "dfa_equiv"
path = "tests/dfa_equiv.rs"

[[test]]
name = "emit_evidence_tests"
path = "tests/emit_evidence_tests.rs"

[[test]]
name = "ni_monitor_egress"
path = "tests/ni_monitor_egress.rs"

[[test]]
name = "safety_case_bundle"
path = "tests/safety_case_bundle.rs"

[[test]]
name = "events_plan_dsl"
path = "tests/events_plan_dsl.rs"

[[test]]
name = "hardened_adapters"
path = "tests/hardened_adapters.rs"

[[test]]
name = "egress_evidence_enforcement"
path = "tests/egress_evidence_enforcement.rs"
