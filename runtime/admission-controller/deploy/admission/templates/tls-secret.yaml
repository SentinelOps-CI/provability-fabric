{{- $cn := include "admission.fullname" . }}
{{- $ca := genCA "admission-ca" 365 }}
{{- $cert := genSignedCert $cn nil (list $cn "admission-controller.default.svc") 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "admission.fullname" . }}-certs
  labels:
    {{- include "admission.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
