[package]
name = "kms-proxy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "=0.12.28", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
time = { version = "=0.3.47", features = ["parsing"] }
ed25519-dalek = "=2.2.0"
futures = "0.3"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
axum = { version = "=0.7.9", features = ["http2"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }
metrics = "0.21"
