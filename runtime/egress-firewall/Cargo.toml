[package]
name = "egress-firewall"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Provability Fabric Team"]
description = "Egress firewall with PII detection using Hyperscan"

[dependencies]
actix-web = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.0", features = [
    "full",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
] }
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
regex = "1.0"
aho-corasick = "1.0"
hyperscan = { version = "0.3", optional = true }
lazy_static = "1.4"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
# Performance optimizations
mimalloc = { version = "0.1", optional = true }
bytes = "1.0"
dashmap = "5.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.0"
# Zero-copy optimizations
serde_bytes = "0.11"

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[features]
# Default: regex/aho-corasick fallback (no native Hyperscan). CI uses --no-default-features.
default = ["fallback", "mimalloc"]
# Optional: requires native libhs. Dedicated optional CI/job only.
hyperscan = ["dep:hyperscan"]
fallback = []
mimalloc = ["dep:mimalloc", "mimalloc/override"]
io_uring = ["tokio/io-util"]
